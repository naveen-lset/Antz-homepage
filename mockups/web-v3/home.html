<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANTZ · Home (web v3 mockup)</title>
<!-- WEB V3 MOCKUP · HOME (13 Oct 2026). The page IS the live home (../../index.html
     in a frame, Figma 918:24), changed only where the review asked:
       1. Announcements stay in the right column under Pending, in their Figma
          container, and the column now ends level with the Modules panel —
          the list scrolls inside it, smoothly, with a fade where it continues.
       2. The same hover as the notes: cards and tiles rise a little.
       3. A module tile (or a module in the Modules explorer) opens that
          module's page (module.html), growing from the tile.
     Nothing in the live build is changed by this file. -->
<style>
  html, body { margin: 0; height: 100%; background: #EFF5F2; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .mockbar { position: fixed; left: 16px; bottom: 16px; z-index: 5; padding: 6px 10px; border-radius: 8px; background: rgba(28, 58, 72, .85); color: #CFE2DC; font: 12px Inter, system-ui, sans-serif; }
  .shade { position: fixed; inset: 0; z-index: 4; pointer-events: none; background: #EFF5F2; opacity: 0; }
</style>
</head>
<body>
<iframe id="home" src="../../index.html" title="ANTZ Home"></iframe>
<div class="shade" id="shade"></div>
<div class="mockbar">Mockup · Home · click a module tile</div>
<script>
/* the module ids module.html draws */
const MOCK = ['hospital', 'medical', 'pharmacy', 'lab', 'species', 'mortality', 'natality', 'fetal', 'eggs', 'housing', 'diet', 'followup', 'parivesh', 'audit', 'administer', 'users', 'security', 'reports', 'approvals', 'communication']
const CSS = `
/* 1 · the right column runs as long as the Modules panel, and Announcements take what is left */
html[data-v2desk] .v2d { align-items: stretch !important; }
html[data-v2desk] .v2d__rail { align-self: stretch !important; height: auto !important; }
html[data-v2desk] .v2d__rail #heroStage { flex: 1 1 auto !important; display: flex !important; flex-direction: column !important; min-height: 0 !important; }
html[data-v2desk] .v2d__rail #heroStage .adeck__stack {
  flex: 1 1 0 !important; max-height: none !important; min-height: 0 !important; overflow-y: auto !important;
  scroll-behavior: smooth; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(31,81,91,.25) transparent;
  -webkit-mask: linear-gradient(#000 calc(100% - 28px), transparent); mask: linear-gradient(#000 calc(100% - 28px), transparent);
  padding-bottom: 20px;
}
html[data-v2desk] .v2d__rail #heroStage .adeck__stack.is-end { -webkit-mask: none; mask: none; }
/* 2 · the same lift as a note card, on every card the home holds */
html[data-v2desk] .v2d__rail #heroStage .adeck__card,
html[data-v2desk] #moduleGrid .card,
html[data-v2desk] #recentObs .obs,
html[data-v2desk] .v2d__rail .fav__card {
  transition: transform 240ms cubic-bezier(.2,.7,.2,1), box-shadow 240ms ease !important;
}
html[data-v2desk] .v2d__rail #heroStage .adeck__card:hover,
html[data-v2desk] #recentObs .obs:hover { transform: translateY(-2px) !important; box-shadow: 0 4px 8px -4px rgba(76,78,100,.42), 0 12px 24px -18px rgba(16,45,52,.35) !important; }
html[data-v2desk] #moduleGrid .card:hover { transform: translateY(-3px) !important; box-shadow: 0 14px 28px -16px rgba(16,45,52,.5) !important; }
html[data-v2desk] .v2d__rail .fav__card:hover { transform: translateY(-2px) !important; }
html[data-v2desk] #moduleGrid .card:active { transform: translateY(-1px) scale(.99) !important; }
@media (prefers-reduced-motion: reduce) { html[data-v2desk] * { transition-duration: 1ms !important; } }
`
const frame = document.getElementById('home'), shade = document.getElementById('shade')
const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches
function open(id, el) {
  const r = el.getBoundingClientRect()
  try { sessionStorage.setItem('antz.v3.from', JSON.stringify({ id, x: r.left, y: r.top, w: r.width, h: r.height })) } catch {}
  if (calm()) { location.href = `module.html?m=${id}`; return }
  /* the rest of the home steps back while the tile stays: the module page grows it */
  el.animate([{ transform: 'none' }, { transform: 'scale(1.03)' }], { duration: 160, easing: 'ease-out', fill: 'forwards' })
  shade.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, delay: 60, easing: 'ease-in', fill: 'forwards' })
    .finished.then(() => { location.href = `module.html?m=${id}` })
}
frame.addEventListener('load', () => {
  const doc = frame.contentDocument; if (!doc) return
  const st = doc.createElement('style'); st.textContent = CSS; doc.head.append(st)
  /* the list says when it has reached its end, so the fade goes */
  const watch = () => {
    const s = doc.querySelector('.v2d__rail #heroStage .adeck__stack'); if (!s) return setTimeout(watch, 200)
    const end = () => s.classList.toggle('is-end', s.scrollTop + s.clientHeight >= s.scrollHeight - 2)
    s.addEventListener('scroll', end, { passive: true }); end()
  }
  watch()
  /* a module tile, or a module in the explorer, opens the mockup's module page */
  doc.addEventListener('click', (e) => {
    const card = e.target.closest?.('#moduleGrid .card[data-variant]')
    const row = e.target.closest?.('.mx [data-mod]')
    const id = card ? card.dataset.variant.split('.')[0] : row ? row.dataset.mod : null
    if (!id || !MOCK.includes(id) || doc.querySelector('[data-editing], .is-editing')) return
    e.preventDefault(); e.stopPropagation()
    open(id, card || row)
  }, true)
  /* coming back from a module: the home fades in */
  let back = null
  try { back = sessionStorage.getItem('antz.v3.back'); sessionStorage.removeItem('antz.v3.back') } catch {}
  if (back && !calm()) doc.documentElement.animate([{ opacity: 0, transform: 'scale(.99)' }, { opacity: 1, transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.2,.7,.2,1)' })
})
</script>
</body>
</html>
