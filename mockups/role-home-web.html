<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Role-based Home · Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  ROLE-BASED HOME ON THE WEB · fifth pass (owner, 11 Oct 2026: "make More
  premium and UX wise also not at all good").

  What was wrong with the fourth pass: eleven cards of the same weight, the
  same item in four places (deworming in the urgent bar, Quick Access,
  Sent to Me and Pending), NEW tags and switches over everything. So:

  ONE ORDER, THE SAME FOR EVERY ROLE
    1 Hero          greeting, one sentence on the day, urgent alerts (only
                    when there are any), Up Next, and the six quick actions —
                    the command centre, on the brand's own landscape
    2 Pending       six counters in one row; overdue is the only red
    3 Your work     ONE list with two tabs — Needs you / Sent to me — instead
                    of three cards
    4 Role tool     the one view this role works from (morning round,
                    treatment schedule, records health, watch list, approvals)
    5 Modules       navigation, so smaller than the work above it
    right rail      My Day · the role's animals · Announcements

  The role switch for review is the floating pill at the foot (keys 1–5).
-->
<style>
:root {
  --bg: #F1F4F2; --surface: #fff; --ink: #0F2529; --ink-2: #44554F; --mute: #7A8884; --hair: rgba(15,37,41,.08);
  --teal: #1F515B; --teal-d: #0E353B; --mint: #43C7B5; --coral: #E0503A; --coral-bg: #FDECE7; --amber: #C98516; --amber-bg: #FCF2DF; --green: #2E8B57; --green-bg: #E5F3EA;
  --sh: 0 1px 2px rgba(15,37,41,.04), 0 10px 30px -18px rgba(15,37,41,.22);
  --g-medical: linear-gradient(135deg, #6FB28C, #2E8B57); --g-hospital: linear-gradient(135deg, #5A7F8B, #2F525D); --g-pharmacy: linear-gradient(135deg, #45C9BD, #12A99B);
  --g-lab: linear-gradient(135deg, #E3C98B, #C9A65A); --g-species: linear-gradient(135deg, #4CA36C, #1E6B43); --g-mortality: linear-gradient(135deg, #F4A08A, #EE7457);
  --g-natality: linear-gradient(135deg, #7AD9CF, #2BB5A6); --g-fetal: linear-gradient(135deg, #F48FA0, #E35D78); --g-eggs: linear-gradient(135deg, #6FD3E3, #2DB3D3);
  --g-housing: linear-gradient(135deg, #7E9AA2, #44646E); --g-diet: linear-gradient(135deg, #F79A6B, #E8613C); --g-followup: linear-gradient(135deg, #6E9098, #3F616A);
  --g-parivesh: linear-gradient(135deg, #7BE3D6, #3CCBBB); --g-administer: linear-gradient(135deg, #B2C2BA, #889D93); --g-users: linear-gradient(135deg, #3F6B78, #234652);
  --g-security: linear-gradient(135deg, #9AA59F, #6A766F); --g-reports: linear-gradient(135deg, #4FD1C5, #22A99D); --g-approvals: linear-gradient(135deg, #4C7280, #24495A);
  --g-insights: linear-gradient(135deg, #8FA7D9, #5B79B8); --g-communication: linear-gradient(135deg, #6E9098, #3F616A);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
img { display: block; }
.wrap { width: min(1392px, calc(100% - 48px)); margin: 0 auto; }
.ico { width: 20px; height: 20px; flex: none; }

/* ── top bar ──────────────────────────────────────────────────────────── */
.top { position: sticky; top: 0; z-index: 50; background: rgba(241,244,242,.82); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--hair); }
.top .wrap { display: flex; align-items: center; gap: 12px; height: 72px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; letter-spacing: .04em; color: var(--teal-d); }
.brand img { width: 34px; height: 34px; border-radius: 10px; object-fit: cover; }
.site { display: inline-flex; align-items: center; gap: 8px; height: 40px; margin-left: 12px; padding: 0 12px 0 14px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair); font-weight: 500; }
.site i { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); }
.search { display: flex; align-items: center; gap: 10px; width: min(440px, 34vw); height: 44px; margin: 0 auto; padding: 0 8px 0 16px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair); color: var(--mute); }
.search span { flex: 1; }
.search kbd { padding: 3px 8px; border-radius: 7px; background: #F1F4F2; font: 600 11.5px Inter, sans-serif; color: var(--mute); }
.tbtn { position: relative; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair); color: var(--ink-2); transition: background 120ms; }
.tbtn:hover { background: #F7FAF8; }
.tbtn em { position: absolute; top: 6px; right: 6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--coral); color: #fff; font: 700 10px/17px Inter, sans-serif; text-align: center; font-style: normal; box-shadow: 0 0 0 2px #fff; }
.tbtn.scan { width: auto; padding: 0 16px 0 14px; display: inline-flex; gap: 8px; background: var(--teal-d); color: #fff; box-shadow: none; font-weight: 600; }
.tbtn.scan:hover { background: var(--teal); }
.me { position: relative; display: flex; cursor: pointer; align-items: center; gap: 10px; margin-left: 6px; padding: 4px 10px 4px 4px; border-radius: 16px; transition: background 120ms; }
.me:hover { background: rgba(255,255,255,.7); }
.me img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #DDEBE9; }
.me b { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.2; }
.me small { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--teal); font-weight: 600; }
.menu { position: absolute; top: 54px; right: 0; z-index: 60; width: 260px; padding: 8px; border-radius: 16px; background: #fff; box-shadow: 0 24px 60px -20px rgba(15,37,41,.35), 0 0 0 1px var(--hair); text-align: left; }
.menu[hidden] { display: none; }
.menu p { margin: 6px 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.menu button { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 40px; padding: 0 10px; border-radius: 10px; font-size: 14px; }
.menu button:hover { background: #F3F7F5; }
.menu button[aria-checked='true'] { color: var(--teal); font-weight: 600; }
.menu button[aria-checked='true']::after { content: '✓'; }

/* ── 1 · hero ─────────────────────────────────────────────────────────── */
.hero { position: relative; margin-top: 24px; border-radius: 28px; overflow: hidden; color: #fff; background: #0E353B; box-shadow: 0 30px 60px -36px rgba(14,53,59,.6); }
.hero__bg { position: absolute; inset: 0; background: url(../assets/img/hero-banner-v2.jpg) right 30% / cover no-repeat; }
.hero__bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,44,49,.97) 0%, rgba(11,44,49,.92) 38%, rgba(11,44,49,.55) 70%, rgba(11,44,49,.25) 100%), linear-gradient(0deg, rgba(11,44,49,.85) 0%, rgba(11,44,49,0) 45%); }
.hero__in { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 40px; padding: 36px 36px 0; }
.eyebrow { display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #9BD6CB; }
.eyebrow i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .6; }
.hero h1 { margin: 10px 0 8px; font-size: 38px; font-weight: 600; letter-spacing: -.025em; line-height: 1.1; }
.hero__sum { margin: 0; max-width: 640px; font-size: 16px; color: rgba(255,255,255,.78); }
.hero__sum b { color: #fff; font-weight: 600; }
.alerts { display: flex; flex-direction: column; gap: 8px; margin-top: 24px; max-width: 640px; }
.al { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; align-items: center; gap: 14px; padding: 12px 12px 12px 16px; border-radius: 16px; background: rgba(224,80,58,.2); box-shadow: inset 0 0 0 1px rgba(255,140,120,.35); backdrop-filter: blur(8px); }
.al.amber { background: rgba(214,138,28,.18); box-shadow: inset 0 0 0 1px rgba(245,190,100,.35); }
.al > i { width: 10px; height: 10px; border-radius: 50%; background: #FF7A62; box-shadow: 0 0 0 4px rgba(255,122,98,.25); animation: pulse 2s ease-in-out infinite; }
.al.amber > i { background: #F5B649; box-shadow: 0 0 0 4px rgba(245,182,73,.25); }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(255,122,98,0); } }
.al b { display: block; font-size: 14.5px; font-weight: 600; }
.al small { display: block; font-size: 12.5px; color: rgba(255,255,255,.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.al__t { padding: 4px 10px; border-radius: 8px; background: rgba(0,0,0,.22); font-size: 12.5px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.al button { height: 34px; padding: 0 14px; border-radius: 10px; background: #fff; color: var(--teal-d); font-size: 13px; font-weight: 600; white-space: nowrap; }
.calm { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; padding: 8px 14px 8px 10px; border-radius: 999px; background: rgba(255,255,255,.1); font-size: 13px; color: rgba(255,255,255,.85); }
.calm i { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); }

/* Up next */
.next { align-self: start; padding: 14px; border-radius: 22px; background: rgba(255,255,255,.96); color: var(--ink); box-shadow: 0 24px 50px -24px rgba(0,0,0,.5); }
.next__h { display: flex; align-items: center; justify-content: space-between; margin: 2px 4px 12px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.next__h b { padding: 3px 9px; border-radius: 999px; background: var(--green-bg); color: #1F6B42; letter-spacing: 0; text-transform: none; font-size: 12px; }
.next__img { position: relative; height: 150px; border-radius: 14px; overflow: hidden; }
.next__img img { width: 100%; height: 100%; object-fit: cover; }
.next__img span { position: absolute; left: 10px; top: 10px; padding: 4px 10px; border-radius: 999px; background: rgba(15,37,41,.72); color: #fff; font-size: 12px; font-weight: 600; backdrop-filter: blur(6px); }
.next h3 { margin: 12px 4px 2px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.next p { margin: 0 4px; font-size: 13px; color: var(--ink-2); }
.next__acts { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 14px; }
.b { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 12px; font-size: 14px; font-weight: 600; transition: background 120ms, transform 120ms; }
.b-pri { background: var(--teal-d); color: #fff; } .b-pri:hover { background: var(--teal); }
.b-ghost { background: #F1F4F2; color: var(--ink-2); } .b-ghost:hover { background: #E7EDEA; }

/* quick actions — the hero's foot */
.qa { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-top: 32px; padding: 0 36px 32px; }
.qa button { display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 14px 0 10px; border-radius: 16px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); backdrop-filter: blur(10px); text-align: left; transition: background 140ms, transform 140ms; }
.qa button:hover { background: rgba(255,255,255,.2); transform: translateY(-2px); }
.qa span { flex: none; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; }
.qa span svg { width: 21px; height: 21px; color: #fff; }
.qa b { font-size: 13.5px; font-weight: 600; line-height: 1.25; }

/* ── 2 · pending ──────────────────────────────────────────────────────── */
.sec-h { display: flex; align-items: baseline; gap: 10px; margin: 36px 4px 14px; }
.sec-h h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.015em; }
.sec-h span { font-size: 13px; color: var(--mute); }
.sec-h a { margin-left: auto; font-size: 13.5px; font-weight: 500; color: var(--teal); text-decoration: none; cursor: pointer; }
.pend { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.pc { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 18px 18px 16px; border-radius: 20px; background: var(--surface); box-shadow: var(--sh); text-align: left; transition: transform 140ms, box-shadow 140ms; }
.pc:hover { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(15,37,41,.04), 0 18px 36px -20px rgba(15,37,41,.3); }
.pc small { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.pc b { font-size: 30px; font-weight: 600; letter-spacing: -.03em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.pc i { font-style: normal; font-size: 12px; color: var(--mute); }
.pc.hot i { color: var(--coral); font-weight: 600; }
.pc.hot::before { content: ''; position: absolute; top: 18px; right: 18px; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }

/* ── grid ─────────────────────────────────────────────────────────────── */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 24px; align-items: start; padding-bottom: 120px; }
.col { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.card { padding: 24px; border-radius: 24px; background: var(--surface); box-shadow: var(--sh); }
.card__h { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.card__h h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.card__h span { font-size: 13px; color: var(--mute); }
.card__h a { margin-left: auto; font-size: 13.5px; font-weight: 500; color: var(--teal); cursor: pointer; }

/* ── 3 · your work — one list, two tabs ───────────────────────────────── */
.tabs { display: inline-flex; gap: 2px; padding: 4px; border-radius: 12px; background: #F1F4F2; }
.tabs button { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 9px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
.tabs button em { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: rgba(15,37,41,.08); font: 600 11.5px/20px Inter, sans-serif; font-style: normal; }
.tabs button[aria-selected='true'] { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(15,37,41,.12); }
.tabs button[aria-selected='true'] em { background: var(--teal-d); color: #fff; }
.rows { display: flex; flex-direction: column; margin: 0 -12px; }
.rows[hidden] { display: none; }
.row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto auto; align-items: center; gap: 14px; padding: 12px; border-radius: 16px; transition: background 120ms; }
.row + .row { box-shadow: 0 -1px 0 var(--hair); }
.row:hover { background: #F6F9F7; box-shadow: none; }
.row:hover + .row { box-shadow: none; }
.av { position: relative; width: 48px; height: 48px; border-radius: 14px; object-fit: cover; }
.av-t { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: #E6EFEC; color: var(--teal); font-size: 14px; font-weight: 700; }
.av-i { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; color: #fff; }
.av-i svg { width: 22px; height: 22px; }
.row b { display: block; font-size: 15px; font-weight: 600; letter-spacing: -.005em; }
.row small { display: block; margin-top: 1px; font-size: 13px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row small strong { color: var(--ink-2); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.bad { background: var(--coral-bg); color: #B83A26; } .pill.warn { background: var(--amber-bg); color: #8C5A0B; }
.pill.ok { background: var(--green-bg); color: #1F6B42; } .pill.info { background: #E9EFF6; color: #345C86; } .pill.mute { background: #EEF2F0; color: var(--ink-2); }
.act { height: 38px; padding: 0 16px; border-radius: 11px; background: #F1F4F2; color: var(--teal-d); font-size: 13.5px; font-weight: 600; white-space: nowrap; transition: background 120ms; }
.act:hover { background: #E4ECE9; }
.act.pri { background: var(--teal-d); color: #fff; } .act.pri:hover { background: var(--teal); }

/* ── 4 · role tool ────────────────────────────────────────────────────── */
.tool { padding: 0; overflow: hidden; }
.tool .card__h { padding: 24px 24px 0; }
.tool__body { padding: 0 24px 24px; }
.tool__foot { display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-top: 1px solid var(--hair); background: #FAFCFB; }
.tool__foot small { font-size: 13px; color: var(--mute); }
.tool__foot .act { margin-left: auto; }
.meter { flex: 1; max-width: 220px; height: 8px; border-radius: 4px; background: #E6ECE9; overflow: hidden; }
.meter u { display: block; height: 100%; border-radius: 4px; background: var(--teal); }
/* patient cards (vet round, zoologist watch list) */
.pcards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.pcard { position: relative; border-radius: 18px; overflow: hidden; background: #F4F7F5; text-align: left; transition: transform 140ms; }
.pcard:hover { transform: translateY(-2px); }
.pcard img { width: 100%; height: 132px; object-fit: cover; }
.pcard div { padding: 12px 14px 14px; }
.pcard b { display: block; font-size: 14px; font-weight: 600; }
.pcard small { display: block; font-size: 12.5px; color: var(--mute); }
.pcard .pill { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,.94); }
.pcard.done { opacity: .5; }
.pcard.cur { box-shadow: 0 0 0 2px var(--teal-d); }
/* timeline list (doctor) */
.tl { display: flex; flex-direction: column; }
.tl__g { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; padding: 14px 0; }
.tl__g + .tl__g { border-top: 1px solid var(--hair); }
.tl__t { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; padding-top: 10px; }
.tl__t small { display: block; font-size: 11.5px; font-weight: 600; color: var(--coral); }
.tl__items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.dose { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 8px 8px 8px; border-radius: 14px; background: #F4F7F5; }
.dose img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; }
.dose b { display: block; font-size: 13.5px; font-weight: 600; }
.dose small { display: block; font-size: 12px; color: var(--mute); }
.dose.late { background: #FFF2EE; box-shadow: inset 0 0 0 1px #F7C9BE; }
.chk { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 1.5px #C9D6D1; color: transparent; transition: background 120ms; }
.chk:hover { box-shadow: inset 0 0 0 1.5px var(--teal); color: var(--teal); }
.dose.late .chk { box-shadow: inset 0 0 0 1.5px var(--coral); }
.chk svg { width: 18px; height: 18px; }
/* records health (biologist) */
.rh { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; align-items: center; }
.ring { position: relative; width: 180px; height: 180px; }
.ring svg { width: 180px; height: 180px; transform: rotate(-90deg); }
.ring div { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring b { font-size: 38px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
.ring small { margin-top: 6px; font-size: 12.5px; color: var(--mute); }
.bulk { display: flex; flex-direction: column; gap: 8px; }
.bulk__r { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 14px; padding: 12px 12px 12px 16px; border-radius: 14px; background: #F4F7F5; }
.bulk__r b { display: block; font-size: 14px; font-weight: 600; }
.bulk__r small { display: block; font-size: 12.5px; color: var(--mute); }
.bulk__r strong { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
/* behaviour chips (zoologist) */
.log { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.log > span { font-size: 13px; color: var(--mute); margin-right: 4px; }
.log button { height: 34px; padding: 0 14px; border-radius: 999px; background: #F1F4F2; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.log button:hover { background: #E4ECE9; }

/* ── 5 · modules ──────────────────────────────────────────────────────── */
.mods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.mod { position: relative; display: flex; align-items: center; gap: 12px; height: 72px; padding: 0 14px; border-radius: 16px; background: #F4F7F5; text-align: left; transition: background 120ms, transform 140ms; }
.mod:hover { background: #EAF1EE; transform: translateY(-1px); }
.mod span { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; }
.mod span img { width: 24px; height: 24px; }
.mod b { font-size: 14px; font-weight: 600; line-height: 1.25; }

.dy__t { font-size: 13px; font-weight: 600; color: var(--mute); font-variant-numeric: tabular-nums; }
.dy__d { position: relative; z-index: 1; width: 12px; height: 12px; margin-left: 1px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px #C9D6D1; }
.dy b { display: block; font-size: 14px; font-weight: 600; }
.dy small { display: block; font-size: 12.5px; color: var(--mute); }
.dy.done b { color: var(--mute); font-weight: 500; text-decoration: line-through; text-decoration-color: rgba(122,136,132,.5); }
.dy.done .dy__d { background: #C9D6D1; box-shadow: none; }
.dy.now { margin: 4px -12px; padding: 12px; border-radius: 14px; background: #EAF4F1; grid-template-columns: 48px 26px minmax(0, 1fr); }
.dy.now .dy__t { color: var(--teal-d); }
.dy.now .dy__d { background: var(--teal-d); box-shadow: 0 0 0 4px rgba(14,53,59,.14); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ph { position: relative; height: 150px; border-radius: 16px; overflow: hidden; text-align: left; }
.ph img { width: 100%; height: 100%; object-fit: cover; transition: transform 300ms ease; }
.ph:hover img { transform: scale(1.04); }
.ph::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.75)); }
.ph div { position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 1; color: #fff; }
.ph b { display: block; font-size: 13.5px; font-weight: 600; }
.ph small { display: block; font-size: 11.5px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph .pill { position: absolute; top: 10px; left: 10px; z-index: 1; background: rgba(255,255,255,.94); }
.ann { display: flex; flex-direction: column; gap: 14px; }
.an { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; }
.an img { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; }
.an b { display: block; font-size: 14px; font-weight: 600; line-height: 1.35; }
.an small { font-size: 12px; color: var(--mute); }

/* ── review pill (mockup only) ────────────────────────────────────────── */
.rv { position: fixed; left: 50%; bottom: 20px; z-index: 70; display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 18px; background: rgba(14,37,41,.92); backdrop-filter: blur(12px); box-shadow: 0 20px 50px -20px rgba(0,0,0,.6); transform: translateX(-50%); }
.rv > span { padding: 0 10px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #8FB8AE; white-space: nowrap; }
.rv button { height: 36px; padding: 0 14px; border-radius: 12px; color: #CFE2DC; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.rv button:hover { background: rgba(255,255,255,.08); }
.rv button[aria-pressed='true'] { background: #fff; color: var(--teal-d); font-weight: 600; }

.sheet { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 24px; background: rgba(10,30,34,.55); backdrop-filter: blur(8px); }
.sheet[hidden] { display: none; }
.sheet__box { width: min(400px, 100%); padding: 16px; border-radius: 26px; background: #fff; box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); }
.vf { position: relative; height: 260px; border-radius: 18px; background: #10262C url(../assets/img/species/asiatic-lion.jpg) center/cover; overflow: hidden; }
.vf::before { content: ''; position: absolute; inset: 50px 70px; border-radius: 18px; box-shadow: 0 0 0 999px rgba(0,0,0,.5), inset 0 0 0 3px var(--mint); }
.vf::after { content: ''; position: absolute; left: 70px; right: 70px; top: 50%; height: 2px; background: var(--mint); box-shadow: 0 0 12px var(--mint); animation: sweep 1.6s ease-in-out infinite alternate; }
@keyframes sweep { from { transform: translateY(-70px); } to { transform: translateY(70px); } }
.vf span { position: absolute; left: 0; right: 0; bottom: 14px; z-index: 1; text-align: center; color: #fff; font-size: 13px; font-weight: 500; }
.found { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 12px; margin-top: 14px; padding: 4px; }
.found img { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; }
.found b { display: block; font-size: 15px; }
.found small { display: block; font-size: 12.5px; color: var(--mute); }
.sheet__acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }

[data-in] { animation: rise 320ms cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { [data-in], .al > i, .vf::after { animation: none; } .pc, .qa button, .mod, .pcard, .ph img { transition: none; } }

@media (max-width: 1240px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .pend { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .qa { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .hero__in { grid-template-columns: minmax(0, 1fr); padding: 28px 24px 0; }
  .qa { padding: 0 24px 24px; }
  .search { display: none; }
  .pcards, .mods { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .rh { grid-template-columns: 1fr; justify-items: center; }
}
@media (max-width: 640px) {
  .wrap { width: calc(100% - 32px); }

  .hero h1 { font-size: 30px; }
  .al { grid-template-columns: 10px minmax(0, 1fr); }

  .qa, .pend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row { grid-template-columns: 48px minmax(0, 1fr); }
  .row .pill { display: none; }
  .row .act { grid-column: 2; justify-self: start; }
  .rv { left: 16px; right: 16px; transform: none; overflow-x: auto; }
}

/* ══ THE FEATURED TOOL OF EACH ROLE ══════════════════════════════════════ */
const card = (title, sub, more, body, foot = '') => `<section class="card tool" data-in><div class="card__h"><h3>${title}</h3>${sub ? `<span>${sub}</span>` : ''}${more ? `<a>${more}</a>` : ''}</div><div class="tool__body">${body}</div>${foot}</section>`
const TOOL = {
  round: (t) => card(t, 'hospital first, then overnight flags', 'All 8 ›',
    `<div class="pcards">${[['asiatic-lion', 'Asiatic Lion', 'Wound, day 3', 'Serious', 'bad', 'cur'], ['cinereous-vulture', 'Cinereous Vulture', 'Serum panel back', 'Serious', 'bad', ''], ['indian-rock-python', 'Indian Rock Python', 'Not feeding', 'Stable', 'ok', ''], ['sloth-bear', 'Sloth Bear', 'Keeper flag · off feed', 'New', 'info', '']].map(([i, n, d, p, t, c]) => `<button class="pcard ${c}"><img src="${IMG(i)}" alt=""><span class="pill ${t}">${p}</span><div><b>${n}</b><small>${d}</small></div></button>`).join('')}</div>`,
    `<div class="tool__foot"><small>3 of 8 seen</small><div class="meter"><u style="width:37%"></u></div><button class="act pri">Continue round</button></div>`),
  schedule: (t) => card(t, 'today · tap the box when given', 'Full day ›',
    `<div class="tl">${[['10:00', 'late', [['asiatic-lion', 'Asiatic Lion', 'Dressing'], ['bonnet-macaque', 'Bonnet Macaque', 'Eye drops']]], ['12:00', '', [['indian-peafowl', 'Indian Peafowl', 'Antibiotic'], ['cinereous-vulture', 'Cinereous Vulture', 'Fluids']]], ['14:00', '', [['blackbuck', 'Blackbuck', 'Antibiotic'], ['indian-rock-python', 'Indian Rock Python', 'Sample']]]].map(([time, late, items]) => `<div class="tl__g"><div class="tl__t">${time}${late ? '<small>Late</small>' : ''}</div><div class="tl__items">${items.map(([i, n, d]) => `<div class="dose${late ? ' late' : ''}"><img src="${IMG(i)}" alt=""><div><b>${n}</b><small>${d}</small></div><button class="chk" aria-label="Mark given">${G.check}</button></div>`).join('')}</div></div>`).join('')}</div>`,
    `<div class="tool__foot"><span class="av-i" style="width:40px;height:40px;border-radius:12px;background:var(--g-natality)">${G.deworm}</span><div><b style="display:block;font-size:14px">Group recording</b><small>Deworm a whole enclosure in one save</small></div><button class="act pri">Start · Deer Paddock</button></div>`),
  records: (t) => card(t, 'Form II needs sex for every animal', 'Open Species ›',

      <div class="bulk"><div style="font-size:13px;color:var(--mute);margin-bottom:2px">Biggest gaps · update a whole enclosure at once</div>${[['Reptile House', 'Crimson Frosted', 2489], ['Hoofstock Barn', 'Hollowpine', 663], ['Aviary 3', 'Clearspring', 654]].map(([n, site, c]) => `<div class="bulk__r"><div><b>${n}</b><small>${site}</small></div><strong>${fmt(c)}</strong><button class="act">Update all</button></div>`).join('')}</div></div>`,
    `<div class="tool__foot"><small>Due 30 Apr 2027 · 201 days</small><div class="meter"><u style="width:41%;background:var(--amber)"></u></div><button class="act pri">Plan sexing</button></div>`),
  watch: (t) => card(t, 'animals not coping', 'All 7 ›',
    `<div class="pcards">${[['asiatic-lion', 'Asiatic Lion', 'Pacing 3 h a day', 'Rising', 'bad'], ['sloth-bear', 'Sloth Bear', 'Score 30 · grieving', 'Falling', 'bad'], ['bonnet-macaque', 'Macaque troop', 'Two fights', 'Tension', 'warn'], ['sarus-crane', 'Sarus Crane', 'Alone 162 days', 'Alone', 'warn']].map(([i, n, d, p, t]) => `<button class="pcard"><img src="${IMG(i)}" alt=""><span class="pill ${t}">${p}</span><div><b>${n}</b><small>${d}</small></div></button>`).join('')}</div>`,
    `<div class="tool__foot"><div class="log"><span>Quick log · Asiatic Lion</span>${['Pacing', 'Not eating', 'Fighting', 'Hiding', 'Normal'].map((c) => `<button>${c}</button>`).join('')}</div></div>`),
  compliance: (t) => card(t, 'licences and statutory returns', 'All 48 ›',
    `<div class="rows">${[['g:parivesh', 'Wildlife protection licence', 'State Forest Dept', '25 d overdue', 'bad', 'Renew'], ['g:reports', 'Quarterly report to CZA', 'Schedule I and II · Jul–Sep', 'In 4 days', 'warn', 'Prepare'], ['g:users', 'Staff zoonotic screening', '18 animal-care staff', 'In 20 days', 'warn', 'Book'], ['g:housing', 'Environmental clearance', 'State Forest Dept', 'In 8 days', 'mute', 'Open']].map(row).join('')}</div>`),
}

/* ── one row of a work list ───────────────────────────────────────────── */
function row([img, t, d, p, tone, act]) {
  const lead = img.startsWith('g:') ? `<span class="av-i" style="background:var(--g-${img.slice(2)})"><img src="${ICON(img.slice(2))}" alt="" style="width:22px;height:22px"></span>` : `<img class="av" src="${IMG(img)}" alt="">`
  return `<div class="row">${lead}<div style="min-width:0"><b>${esc(t)}</b><small>${esc(d)}</small></div><span class="pill ${tone}">${p}</span><button class="act${tone === 'bad' ? ' pri' : ''}">${act}</button></div>`
}
const sentRow = ([from, frole, t, d, act]) => `<div class="row"><span class="av-t">${initials(from)}</span><div style="min-width:0"><b>${esc(t)}</b><small><strong>${esc(from)}</strong>${frole ? ` · ${frole}` : ''} · ${esc(d)}</small></div><span></span><button class="act pri">${act}</button></div>`

/* ── the page ─────────────────────────────────────────────────────────── */
function hero(r) {
  const [time, title, place, img, status, act] = r.next
  return `<div class="hero__bg"></div>
  <div class="hero__in" data-in>
    <div>
      <div class="eyebrow">Sunday, 11 October<i></i>${r.name}<i></i>All sites</div>
      <h1>Good morning, ${r.first}</h1>
      <p class="hero__sum">${r.sum}</p>
      ${r.alerts.length ? `<div class="alerts">${r.alerts.map(([t, d, tm, a, amber]) => `<div class="al${amber ? ' amber' : ''}"><i></i><div style="min-width:0"><b>${esc(t)}</b><small>${esc(d)}</small></div><span class="al__t">${tm}</span><button>${a}</button></div>`).join('')}</div>`
        : `<div class="calm"><i></i>Nothing urgent right now</div>`}
    </div>
    <aside class="next">
      <div class="next__h">Up next<b>${time}</b></div>
      <div class="next__img"><img src="${IMG(img)}" alt=""><span>${status}</span></div>
      <h3>${esc(title)}</h3><p>${esc(place)}</p>
      <div class="next__acts"><button class="b b-pri">${act}</button><button class="b b-ghost">Later</button></div>
    </aside>
  </div>
  <div class="qa" data-in>${r.qa.map(([g, c, l]) => `<button><span style="background:var(--g-${c})">${G[g]}</span><b>${l}</b></button>`).join('')}</div>`
}
function work(r) {
  return `<section class="card" data-in>
    <div class="card__h"><h3>Your work</h3><div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="needs">Needs you<em>${r.needs.length}</em></button><button role="tab" aria-selected="false" data-tab="sent">Sent to me<em>${r.sent.length}</em></button></div><a>View all</a></div>
    <div class="rows" data-panel="needs">${r.needs.map(row).join('')}</div>
    <div class="rows" data-panel="sent" hidden>${r.sent.map(sentRow).join('')}</div>
  </section>`
}
function modules(r) {
  return `<section class="card" data-in><div class="card__h"><h3>Modules</h3><span>yours first</span><a>All modules</a></div>
    <div class="mods">${r.mods.map(([k, n]) => `<button class="mod"><span style="background:var(--g-${k})"><img src="${ICON(k)}" alt=""></span><b>${MODS[k]}</b>${n ? `<em>${fmt(n)}</em>` : ''}</button>`).join('')}</div></section>`
}
function myDay(r) {
  return `<section class="card" data-in><div class="card__h"><h3>My Day</h3><span>${r.day.length} items</span><a>Calendar</a></div>
    <div class="day">${r.day.map(([t, w, d, st]) => `<div class="dy ${st}"><span class="dy__t">${t}</span><span class="dy__d"></span><div><b>${esc(w)}</b><small>${esc(d)}</small></div></div>`).join('')}</div></section>`
}
function animals(r) {
  if (!r.animals) return ''
  return `<section class="card" data-in><div class="card__h"><h3>${r.animals.title}</h3><a>View all</a></div>
    <div class="grid2">${r.animals.rows.map(([i, n, sub, p, t]) => `<button class="ph"><img src="${IMG(i)}" alt=""><span class="pill ${t}">${p}</span><div><b>${n}</b><small>${sub}</small></div></button>`).join('')}</div></section>`
}
function announcements() {
  return `<section class="card" data-in><div class="card__h"><h3>Announcements</h3><a>View all</a></div>
    <div class="ann">${ANN.map((a) => `<div class="an"><img src="${a.img}" alt=""><div><b>${esc(a.t)}</b><small>${a.by}</small></div></div>`).join('')}</div></section>`
}

/* ── render and wiring ────────────────────────────────────────────────── */
let role = 'vet'
try { const v = localStorage.getItem('antz.mock.role5'); if (ROLES[v]) role = v } catch {}

function render() {
  const r = ROLES[role]
  $('hero').innerHTML = hero(r)
  const hot = r.pending.filter((p) => p[3]).length
  $('pendSub').textContent = hot ? `${hot} overdue` : ''
  $('pend').innerHTML = r.pending.map(([l, n, foot, h]) => `<button class="pc${h ? ' hot' : ''}" data-in><small>${l}</small><b>${fmt(n)}</b><i>${foot}</i></button>`).join('')
  $('left').innerHTML = work(r) + TOOL[r.tool[0]](r.tool[1]) + modules(r)
  $('right').innerHTML = myDay(r) + animals(r) + announcements()
  $('roleName').textContent = r.name
  $('bellN').textContent = r.sent.length + r.alerts.length
  $('sheetActs').innerHTML = r.scan.map((a, i) => `<button class="b ${i ? 'b-ghost' : 'b-pri'}">${a}</button>`).join('')
  $('rvTabs').innerHTML = Object.entries(ROLES).map(([k, v], i) => `<button data-role="${k}" aria-pressed="${k === role}" title="Key ${i + 1}">${v.name}</button>`).join('')
  $('menu').innerHTML = `<p>Switch role</p>` + Object.entries(ROLES).map(([k, v]) => `<button type="button" role="menuitemradio" data-role="${k}" aria-checked="${k === role}">${v.name}</button>`).join('')
  document.title = `${r.name} · ANTZ Home`
}
function setRole(k) {
  if (!ROLES[k] || k === role) return
  role = k
  try { localStorage.setItem('antz.mock.role5', k) } catch {}
  render()
}
const closeMenu = () => { $('menu').hidden = true; $('meBtn').setAttribute('aria-expanded', 'false') }

document.addEventListener('click', (e) => {
  const pick = e.target.closest('[data-role]')
  if (pick) { setRole(pick.dataset.role); closeMenu(); return }
  const tab = e.target.closest('[data-tab]')
  if (tab) {
    const card = tab.closest('.card')
    card.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', b === tab))
    card.querySelectorAll('[data-panel]').forEach((p) => { p.hidden = p.dataset.panel !== tab.dataset.tab })
    return
  }
  if (e.target.closest('#meBtn') && !e.target.closest('#menu')) { const open = $('menu').hidden; $('menu').hidden = !open; $('meBtn').setAttribute('aria-expanded', open); return }
  if (e.target.closest('#scanBtn')) { $('sheet').hidden = false; return }
  if (e.target.id === 'sheet') { $('sheet').hidden = true; return }
  if (!e.target.closest('#menu')) closeMenu()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeMenu(); $('sheet').hidden = true }
  const i = Number(e.key) - 1, keys = Object.keys(ROLES)
  if (!e.metaKey && !e.ctrlKey && !e.altKey && i >= 0 && i < keys.length) setRole(keys[i])
})
render()
</script>
