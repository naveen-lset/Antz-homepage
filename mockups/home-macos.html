<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANTZ for Mac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&display=swap">
<!--
  ANTZ ON A MAC — a mockup, not the app (6 Oct 2026).
  The owner's brief, on the 30 Sep desktop (home-web-layouts.html, C) and two
  references (a widget desktop, the macOS App Library panel): "a Dock at the
  bottom where I can add my things; on the left my favourite animals; every
  module opens from something like the reference; something interesting for
  the users who already know ANTZ."
    · the desktop is the home page: the widgets on the left, the Dock below
    · the Dock is the user's: drag a module in from the Modules panel, drag to
      reorder, drag one out and it goes. Kept in this browser (localStorage)
    · the Modules panel is the App Library: search, categories, every module
    · windows open out of their Dock icon and go back into it
    · returning users get "Welcome back" — what moved since their last visit —
      the announcements as a notification stack, and one tip for the Dock
  The data is the app's, read off the live V2 page the same day.
-->
<style>
:root {
  --ink: #1F415B; --ink-2: #44544A; --mute: #7A8684; --teal: #1F515B; --coral: #F06D52;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --num: "DM Sans", Inter, sans-serif;
  --glass: rgba(255,255,255,.62);
  --spring: cubic-bezier(.2,.9,.25,1.05);
  --ease: cubic-bezier(.32,.72,0,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
  background: #264B3F url(../assets/img/hero-banner-v2.jpg) center / cover no-repeat; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
input { font: inherit; }
img { display: block; -webkit-user-drag: none; }  /* no native image drag: it cancels the pointer stream mid-drag */
.glass { background: var(--glass); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); box-shadow: 0 10px 30px rgba(0,0,0,.18), inset 0 0 0 .5px rgba(255,255,255,.7); }

/* ── menu bar ── */
.mb { position: fixed; z-index: 900; top: 0; left: 0; right: 0; height: 28px; display: flex; align-items: center; gap: 2px; padding: 0 10px; font-size: 13px; color: #161B1D;
  background: rgba(240,245,243,.55); -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%); }
.mb__it { height: 22px; padding: 0 9px; border-radius: 5px; display: flex; align-items: center; gap: 6px; }
.mb__it:hover, .mb__it.open { background: rgba(0,0,0,.09); }
.mb__it b { font-weight: 700; }
.mb__logo img { width: 16px; height: 16px; border-radius: 4px; }
.mb__r { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.mb__r svg { width: 15px; height: 15px; }
.menu { position: fixed; z-index: 950; top: 26px; min-width: 220px; padding: 5px; border-radius: 10px; font-size: 13px; display: none;
  background: rgba(246,248,247,.86); -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%); box-shadow: 0 12px 34px rgba(0,0,0,.25), inset 0 0 0 .5px rgba(255,255,255,.6), 0 0 0 .5px rgba(0,0,0,.15); }
.menu.open { display: block; }
.menu button { display: flex; align-items: center; gap: 8px; width: 100%; height: 24px; padding: 0 10px; border-radius: 5px; text-align: left; }
.menu button:hover { background: #2B6CB0; color: #fff; }
.menu button kbd { margin-left: auto; padding-left: 16px; font: inherit; opacity: .55; }
.menu button .chk { width: 12px; }
.menu hr { margin: 5px 8px; border: 0; border-top: 1px solid rgba(0,0,0,.1); }
.menu .dim { opacity: .4; pointer-events: none; }

/* ── widgets ── */
.wgs { position: fixed; z-index: 2; top: 40px; left: 16px; width: 344px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; transition: opacity .3s, transform .4s var(--ease); }
.wgs.hide { opacity: 0; transform: translateX(-30px); pointer-events: none; }
.wg { position: relative; border-radius: 22px; padding: 14px; color: #1D2B33; text-align: left; }
.wg h6 { margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: #54636A; }
.wg h6 button { font-size: 12px; font-weight: 600; color: #54636A; }
.wg.s { aspect-ratio: 1; display: flex; flex-direction: column; justify-content: space-between; }
.wg.m { grid-column: span 2; }
.big { font-size: 42px; font-weight: 300; line-height: 1; letter-spacing: -1px; }
.wg small { font-size: 12px; color: #54636A; }
#wgGreet { cursor: pointer; }
.today__n { font: 500 40px/1 var(--num); color: #E2553A; transition: opacity .15s; }
.today__n.nat { color: #13A89E; }
.seg { display: flex; padding: 2px; border-radius: 8px; background: rgba(0,0,0,.06); }
.seg button { flex: 1; height: 20px; border-radius: 6px; font-size: 11px; color: #44544A; }
.seg button[aria-pressed='true'] { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.flip { display: flex; gap: 4px; font-size: 11px; font-weight: 600; color: #54636A; }
.flip button { padding: 2px 6px; border-radius: 5px; }
.flip button[aria-pressed='true'] { background: rgba(0,0,0,.08); color: #1D2B33; }
.ring { width: 64px; height: 64px; }
.aud__sites { display: grid; gap: 3px; font-size: 11.5px; color: #44544A; }
.aud__sites span { display: flex; justify-content: space-between; }
.pl { display: grid; gap: 6px; }
.pl button { display: flex; align-items: center; gap: 8px; font-size: 12.5px; text-align: left; padding: 1px 0; }
.pl button:hover span { text-decoration: underline; }
.pl i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.pl b { margin-left: auto; font: 600 13px var(--num); font-variant-numeric: tabular-nums; }
.fg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; }
.fa { position: relative; display: grid; gap: 5px; justify-items: center; font-size: 11px; color: #33434A; }
.fa img { width: 62px; height: 62px; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,.2), 0 0 0 2px rgba(255,255,255,.8); transition: transform .2s var(--spring); }
.fa:hover img { transform: scale(1.07); }
.fa > span:last-child { max-width: 74px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fa__x { position: absolute; z-index: 1; top: -4px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #8E9A9E; color: #fff; font-size: 13px; line-height: 20px; display: none; }
.editing .fa__x { display: block; }
.editing .fa img { animation: jig .28s ease-in-out infinite alternate; }
@keyframes jig { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
.fa--add div { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; color: #54636A; background: rgba(255,255,255,.45); box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.12); }

/* ── notifications (returning users) ── */
.nc { position: fixed; z-index: 700; top: 40px; right: 14px; width: 356px; display: grid; gap: 12px; transition: transform .45s var(--ease), opacity .3s; }
.nc.away { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
.nt { position: relative; border-radius: 18px; padding: 12px 14px; font-size: 13px; line-height: 17px; color: #1D2B33; animation: ntIn .6s var(--spring) both; transition: transform .35s var(--ease), opacity .3s; }
.nt:nth-child(2) { animation-delay: .35s; } .nt:nth-child(3) { animation-delay: .7s; }
@keyframes ntIn { from { opacity: 0; transform: translateX(110%); } }
.nt.gone { opacity: 0; transform: translateX(110%); }
.nt__h { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; color: #54636A; }
.nt__h img { width: 18px; height: 18px; border-radius: 5px; }
.nt__h time { margin-left: auto; }
.nt b { font-weight: 600; }
.nt__x { position: absolute; top: -6px; left: -6px; width: 20px; height: 20px; border-radius: 50%; background: rgba(240,240,240,.95); box-shadow: 0 1px 4px rgba(0,0,0,.25); font-size: 12px; color: #444; opacity: 0; transition: opacity .15s; }
.nt:hover .nt__x { opacity: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips span { padding: 3px 8px; border-radius: 10px; background: rgba(0,0,0,.06); font-size: 12px; }
.chips span b { font-family: var(--num); }
.nt__btns { display: flex; gap: 8px; margin-top: 10px; }
.nt__btns button { flex: 1; height: 28px; border-radius: 8px; background: rgba(0,0,0,.07); font-size: 12.5px; font-weight: 500; }
.nt__btns button.pri { background: #1F515B; color: #fff; }
.stack { cursor: pointer; }
.stack::before, .stack::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -6px; height: 12px; border-radius: 0 0 16px 16px; background: rgba(255,255,255,.5); z-index: -1; transition: opacity .3s; }
.stack::after { left: 20px; right: 20px; bottom: -11px; background: rgba(255,255,255,.35); }
.stack.open::before, .stack.open::after { opacity: 0; }
.stack__list { display: grid; gap: 6px; max-height: 0; overflow: hidden; transition: max-height .45s var(--ease), margin .3s; }
.stack.open .stack__list { max-height: 520px; margin-top: 10px; }
.stack__list button { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; padding: 6px; border-radius: 10px; background: rgba(255,255,255,.55); text-align: left; font-size: 12.5px; }
.stack__list button:hover { background: rgba(255,255,255,.85); }
.stack__list i { width: 34px; height: 34px; border-radius: 8px; background: #DDE center / cover; }
.stack__list small { display: block; color: #7A8684; font-size: 11.5px; }

/* ── dock ── */
.dock { position: fixed; z-index: 800; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 6px; padding: 6px 8px; border-radius: 22px; height: 68px;
  background: rgba(255,255,255,.3); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.55), 0 10px 30px rgba(0,0,0,.22); }
.di { position: relative; flex: none; width: 52px; height: 52px; transition: width .1s ease-out, height .1s ease-out; }
.dock.calm .di { transition: width .25s var(--ease), height .25s var(--ease); }
.di .ic { width: 100%; height: 100%; }
.di::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 14px); left: 50%; transform: translateX(-50%); padding: 4px 10px; border-radius: 6px; background: rgba(40,40,40,.82); color: #fff; font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; }
.di:hover::after { opacity: 1; }
.dragging .di::after { opacity: 0 !important; }
.di.run::before { content: ''; position: absolute; bottom: -5px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: rgba(20,20,20,.75); }
.di.gap { opacity: 0; }
.dock hr { align-self: center; flex: none; width: 1px; height: 44px; margin: 0 4px; border: 0; background: rgba(0,0,0,.18); }

/* an icon: a rounded square, the module's gradient or photo, its glyph in white */
.ic { position: relative; display: grid; place-items: center; border-radius: 23%; background: #6B7F78 center / cover; box-shadow: 0 2px 6px rgba(0,0,0,.18), inset 0 0 0 .5px rgba(255,255,255,.35); overflow: hidden; }
.ic::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 45%); }
.ic.ph::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.28); }
.ic img { position: relative; z-index: 1; width: 56%; height: 56%; object-fit: contain; filter: drop-shadow(0 1px 1px rgba(0,0,0,.15)); }
.ic svg { position: relative; z-index: 1; width: 52%; height: 52%; }

/* the ghost under a dragging pointer, and the poof */
.ghost { position: fixed; z-index: 2000; width: 60px; height: 60px; pointer-events: none; transform: translate(-50%, -50%) scale(1.05); transition: opacity .15s; }
.ghost .ic { width: 100%; height: 100%; box-shadow: 0 12px 26px rgba(0,0,0,.35); }
.ghost em { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); padding: 3px 8px; border-radius: 6px; background: rgba(40,40,40,.85); color: #fff; font: 600 11px var(--font); font-style: normal; white-space: nowrap; display: none; }
.ghost.rm em { display: block; } .ghost.rm { opacity: .7; }
.poof { position: fixed; z-index: 2001; width: 70px; height: 70px; margin: -35px 0 0 -35px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.95) 0 20%, rgba(255,255,255,.6) 35%, rgba(255,255,255,0) 65%); animation: poof .45s ease-out forwards; }
@keyframes poof { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }

/* ── the Modules panel: the App Library ── */
.lib { position: fixed; z-index: 850; left: 50%; bottom: 92px; width: 740px; max-height: calc(100vh - 140px); display: flex; flex-direction: column; border-radius: 30px; padding: 22px 26px 24px;
  background: rgba(236,246,250,.66); -webkit-backdrop-filter: blur(40px) saturate(190%); backdrop-filter: blur(40px) saturate(190%);
  box-shadow: 0 30px 80px rgba(0,0,0,.35), inset 0 0 0 .5px rgba(255,255,255,.8);
  transform-origin: var(--ox, 50%) 100%; transform: translateX(-50%) scale(.2); opacity: 0; pointer-events: none; transition: transform .38s var(--spring), opacity .2s; }
.lib.open { transform: translateX(-50%) scale(1); opacity: 1; pointer-events: auto; }
.lib.faint { opacity: .3 !important; }
.lib__h { display: flex; align-items: center; gap: 12px; }
.lib__h svg { width: 28px; height: 28px; color: #4A5560; }
.lib__h h2 { margin: 0; font-size: 26px; font-weight: 400; color: #2A3640; }
.lib__more { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px rgba(40,50,60,.5); color: #3A4650; font-weight: 700; letter-spacing: 1px; }
.lib__search { margin-top: 14px; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 10px; background: rgba(255,255,255,.55); }
.lib__search input { flex: 1; border: 0; background: none; outline: 0; font-size: 14px; color: #2A3640; }
.lib__cats { flex: none; display: flex; gap: 8px; margin: 12px 0 4px; padding-bottom: 14px; border-bottom: 1px solid rgba(40,60,80,.12); overflow-x: auto; scrollbar-width: none; }
.lib__cats button { flex: none; height: 30px; padding: 0 14px; border-radius: 10px; background: rgba(255,255,255,.55); font-size: 14px; color: #6B7A84; transition: background .15s, color .15s; }
.lib__cats button[aria-pressed='true'] { background: #1F515B; color: #fff; }
.lib__sec { margin: 14px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; color: #6B7A84; }
.lib__grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px 8px; padding: 6px 2px; }
.lib__rule { height: 1px; background: rgba(40,60,80,.12); margin: 8px 0 2px; }
.tile { position: relative; display: grid; justify-items: center; gap: 7px; font-size: 13px; color: #1E2A33; text-align: center; animation: tileIn .35s var(--spring) both; cursor: pointer; }
.tile .ic { width: 64px; height: 64px; transition: transform .18s var(--spring); }
.tile:hover .ic { transform: scale(1.08); }
.tile span { line-height: 16px; }
@keyframes tileIn { from { opacity: 0; transform: translateY(8px) scale(.9); } }
.tile__b { position: absolute; top: -6px; left: calc(50% + 22px); z-index: 2; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 600; color: #fff; background: #1F515B; box-shadow: 0 2px 6px rgba(0,0,0,.25); opacity: 0; transform: scale(.6); transition: opacity .15s, transform .2s var(--spring); }
.tile:hover .tile__b { opacity: 1; transform: none; }
.tile__b.in { background: #8E9A9E; }
.tile__dot { position: absolute; top: 67px; width: 4px; height: 4px; border-radius: 50%; background: rgba(20,20,20,.6); }
.lib__none { grid-column: 1 / -1; padding: 30px 0; text-align: center; color: #6B7A84; }

/* ── windows ── */
.win { position: fixed; z-index: 10; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: #F7F9F8;
  box-shadow: 0 22px 70px rgba(0,0,0,.38), 0 0 0 .5px rgba(0,0,0,.28); transform-origin: 0 0; }
.win:not(.act) { box-shadow: 0 12px 40px rgba(0,0,0,.22), 0 0 0 .5px rgba(0,0,0,.2); }
.win.anim { transition: transform .42s var(--ease), opacity .35s, left .35s var(--ease), top .35s var(--ease), width .35s var(--ease), height .35s var(--ease); }
.win__bar { flex: none; position: relative; display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px; background: rgba(247,249,248,.94); border-bottom: 1px solid rgba(0,0,0,.08); cursor: default; }
.win__title { font-size: 13px; font-weight: 600; color: #2A3640; }
.win:not(.act) .win__title { color: #9AA0A3; }
.tl { display: flex; gap: 8px; }
.tl button { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); font-size: 9px; line-height: 12px; color: transparent; font-weight: 800; }
.tl button:nth-child(1) { background: #FF5F57; } .tl button:nth-child(2) { background: #FEBC2E; } .tl button:nth-child(3) { background: #28C840; }
.tl:hover button { color: rgba(0,0,0,.55); }
.win:not(.act) .tl:not(:hover) button { background: #D6D6D6; }
.win__tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.wsearch { display: flex; align-items: center; gap: 6px; height: 30px; width: 220px; padding: 0 10px; border-radius: 8px; background: rgba(0,0,0,.05); font-size: 12px; color: #8A9599; cursor: text; }
.wsearch svg { width: 14px; height: 14px; }
.wsearch kbd { margin-left: auto; font: 11px var(--font); opacity: .7; }
.qbtn { height: 30px; padding: 0 12px; border-radius: 8px; background: var(--coral); color: #fff; font-size: 12px; font-weight: 600; }
.win__body { flex: 1; min-height: 0; display: flex; }
.side { flex: none; width: 210px; padding: 10px 8px; background: rgba(236,241,239,.85); border-right: 1px solid rgba(0,0,0,.06); overflow: auto; }
.side h6 { margin: 12px 8px 4px; font-size: 11px; font-weight: 600; color: #8A9599; }
.src { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border-radius: 6px; font-size: 13px; text-align: left; color: #22303A; }
.src:hover { background: rgba(31,65,91,.07); }
.src[aria-current='true'] { background: rgba(31,65,91,.14); font-weight: 600; }
.src .ic { width: 18px; height: 18px; border-radius: 5px; box-shadow: none; flex: none; }
.src .dotc { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; flex: none; }
.src em { margin-left: auto; font-style: normal; font-size: 11px; color: #8A9599; }
.main { flex: 1; min-width: 0; overflow: auto; padding: 18px 20px 30px; }
.main h3 { margin: 0 0 12px; font-size: 16px; font-weight: 500; color: #000; display: flex; justify-content: space-between; align-items: center; }
.main h3 button { font-size: 13px; font-weight: 500; color: #44544A; }
.panel { margin-bottom: 18px; padding: 18px; border-radius: 14px; }
.panel--ann { background: linear-gradient(180deg, rgba(175,239,235,.5), rgba(203,234,232,.45)); }
.panel--obs { background: linear-gradient(180deg, rgba(31,81,91,.1), rgba(132,157,161,.1)); }
.panel--ki { background: rgba(31,81,91,.05); }
.acard { display: grid; grid-template-columns: 1fr 260px; gap: 20px; min-height: 196px; padding: 16px; border-radius: 12px; background: #fff; box-shadow: 0 2px 12px rgba(31,65,91,.08); animation: fadeUp .4s var(--ease); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } }
.acard__chip { display: inline-flex; align-items: center; gap: 8px; padding: 2px 12px 2px 2px; border-radius: 15px; background: rgba(55,189,105,.1); color: #2FA85C; font-size: 11px; font-weight: 500; letter-spacing: .3px; }
.acard__chip img { width: 24px; height: 24px; }
.acard[data-k='important'] .acard__chip { background: rgba(233,51,83,.1); color: #E93353; }
.acard[data-k='fact'] .acard__chip { background: rgba(0,175,214,.1); color: #0089A8; }
.acard h4 { margin: 10px 0 6px; font-size: 17px; font-weight: 500; line-height: 23px; color: #00A6C4; }
.acard[data-k='important'] h4 { color: #E93353; }
.acard p { margin: 0; font-size: 13.5px; line-height: 20px; color: #44544A; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.acard small { display: block; margin-top: 10px; font-size: 12px; color: #7A8684; }
.acard__img { border-radius: 10px; background: linear-gradient(135deg, #CFEDEA, #E6F3F1) center / cover; }
.acnav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 12px; }
.acnav .dots { display: flex; gap: 6px; }
.acnav .dots i { width: 8px; height: 8px; border-radius: 4px; background: rgba(31,65,91,.18); cursor: pointer; transition: width .25s, background .25s; }
.acnav .dots i.on { width: 20px; background: rgba(0,0,0,.25); }
.acnav button { font-size: 18px; color: #44544A; width: 26px; height: 26px; border-radius: 50%; }
.acnav button:hover { background: rgba(0,0,0,.06); }

const di = (id, pin) => `<button class="di${running.has(id) ? ' run' : ''}" data-id="${id}"${pin ? ' data-pin="1"' : ''} data-tip="${esc(nameOf(id))}" aria-label="${esc(nameOf(id))}">${icon(id)}</button>`

/* the magnification: each icon grows with its nearness to the pointer, as the real Dock does */
dock.addEventListener('mousemove', (e) => {
  if (!magOn || drag) return
  dock.classList.remove('calm')
  $$('.di', dock).forEach((b) => {
    const r = b.getBoundingClientRect(), d = Math.abs(e.clientX - (r.left + r.width / 2)), k = Math.max(0, 1 - d / 150)
    b.style.width = b.style.height = 52 + 30 * Math.sin(k * Math.PI / 2) ** 2 + 'px'
  })
})
dock.addEventListener('mouseleave', () => { dock.classList.add('calm'); $$('.di', dock).forEach((b) => (b.style.width = b.style.height = '')) })

/* a click opens; a drag reorders, or leaves the Dock and goes */
dock.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.di'); if (!b || e.button) return
  const id = b.dataset.id, pin = !!b.dataset.pin, x0 = e.clientX, y0 = e.clientY
  const move = (ev) => { if (!drag && pin && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 6) startDrag(id, 'dock', ev) }
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); if (!drag) clickDock(id, b) }
  addEventListener('pointermove', move); addEventListener('pointerup', up)
})
function clickDock(id, b) {
  if (id === 'lib') return toggleLib(b)
  if (id === 'qa') return toggleQA(b)
  if (id === 'spot') return openSpot()
  closeLib(); openWin(id, b)
}
function startDrag(id, from, ev) {
  closeQA(); drag = { id, from }
  document.body.classList.add('dragging'); dock.classList.add('calm'); $$('.di', dock).forEach((b) => (b.style.width = b.style.height = ''))
  if (from === 'dock') pins = pins.filter((p) => p !== id)
  if (from === 'lib') $('#lib').classList.add('faint')
  const g = document.createElement('div'); g.className = 'ghost'; g.innerHTML = icon(id) + '<em>Remove</em>'; document.body.append(g); drag.g = g
  gapAt = -1; renderDock(); onDrag(ev)
  addEventListener('pointermove', onDrag); addEventListener('pointerup', endDrag, { once: true })
}
function onDrag(ev) {
  const g = drag.g; g.style.left = ev.clientX + 'px'; g.style.top = ev.clientY + 'px'
  const dr = dock.getBoundingClientRect(), over = ev.clientY > dr.top - 60 && ev.clientX > dr.left - 40 && ev.clientX < dr.right + 40
  g.classList.toggle('rm', drag.from === 'dock' && !over)
  let at = -1
  if (over) {
    const pinned = $$('.di[data-pin]', dock); at = pinned.length
    for (let i = 0; i < pinned.length; i++) { const r = pinned[i].getBoundingClientRect(); if (ev.clientX < r.left + r.width / 2) { at = i; break } }
    if (drag.from === 'lib' && pins.includes(drag.id)) at = -1
  }
  if (at !== gapAt) { gapAt = at; renderDock() }
}
function endDrag(ev) {
  removeEventListener('pointermove', onDrag)
  const { id, from, g } = drag, at = gapAt
  gapAt = -1; g.remove(); drag = null; document.body.classList.remove('dragging'); $('#lib').classList.remove('faint')
  if (at >= 0) { pins.splice(at, 0, id); if (from === 'lib') toast(`${nameOf(id)} added to your Dock`) }
  else if (from === 'dock') { const p = document.createElement('div'); p.className = 'poof'; p.style.left = ev.clientX + 'px'; p.style.top = ev.clientY + 'px'; document.body.append(p); setTimeout(() => p.remove(), 500); toast(`${nameOf(id)} removed from your Dock`) }
  saveDock(); renderDock(); if ($('#lib').classList.contains('open')) renderLib()
}

/* ── windows: out of the Dock icon, back into it ── */
const wins = new Map()
let z = 20, cascade = 0
function openWin(id, fromEl) {
  if (id !== 'home') { recent = [id, ...recent.filter((r) => r !== id)].slice(0, 6); store.set('antz.mac.recent', recent) }
  let w = wins.get(id)
  if (w) { if (w.min) restore(w, fromEl); focus(w); return w }
  const el = document.createElement('section'); el.className = 'win'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', nameOf(id))
  const W = Math.min(id === 'home' ? 1180 : 860, innerWidth - 400), H = Math.min(id === 'home' ? 820 : 640, innerHeight - 130)
  const left = Math.max(372, Math.min(innerWidth - W - 16, 380 + cascade * 26)), top = 46 + cascade * 22; cascade = (cascade + 1) % 5
  Object.assign(el.style, { left: left + 'px', top: top + 'px', width: W + 'px', height: H + 'px' })
  el.innerHTML = `<header class="win__bar"><div class="tl"><button data-a="close" aria-label="Close">×</button><button data-a="min" aria-label="Minimise">–</button><button data-a="zoom" aria-label="Zoom">+</button></div>` +
    `<span class="win__title">${id === 'home' ? 'Home — <span data-scope>' + esc(scope) + '</span>' : esc(nameOf(id))}</span>` +
    `<div class="win__tools"><span class="wsearch">${MAG('#8A9599')}Search<kbd>⌘K</kbd></span><button class="qbtn">+ Quick Actions</button></div></header>` +
    `<div class="win__body">${id === 'home' ? homeBody() : modBody(id)}</div>`
  $('#wins').append(el)
  w = { id, el, min: false, zoom: null }; wins.set(id, w); running.add(id); renderDock()
  $('#nc').classList.add('away')   /* the banners clear once there is work on screen; the menu bar brings them back */
  if ($('.tip')) { $('.tip').remove(); store.set('antz.mac.tip', true) }
  wire(w); focus(w); fly(el, fromEl || $(`.di[data-id="${id}"]`), true)
  return w
}
/* the flight: a FLIP from the icon's box to the window's */
function fly(el, from, opening, done) {
  const to = el.getBoundingClientRect()
  const f = from && from.isConnected ? from.getBoundingClientRect() : { left: to.left + to.width / 2 - 30, top: to.top + to.height / 2 - 30, width: 60, height: 60 }
  const tf = `translate(${f.left - to.left}px, ${f.top - to.top}px) scale(${f.width / to.width}, ${f.height / to.height})`
  el.classList.remove('anim')
  if (opening) { el.style.transform = tf; el.style.opacity = '.3'; el.getBoundingClientRect(); el.classList.add('anim'); el.style.transform = ''; el.style.opacity = '' }
  else { el.classList.add('anim'); el.style.transform = tf; el.style.opacity = '0' }
  setTimeout(() => { el.classList.remove('anim'); done && done() }, 440)
}
function focus(w) { wins.forEach((x) => x.el.classList.toggle('act', x === w)); w.el.style.zIndex = ++z }
function closeWin(w) { fly(w.el, $(`.di[data-id="${w.id}"]`), false, () => w.el.remove()); wins.delete(w.id); running.delete(w.id); renderDock() }
function minWin(w) { w.min = true; fly(w.el, $(`.di[data-id="${w.id}"]`), false, () => (w.el.style.visibility = 'hidden')) }
function restore(w, from) { w.min = false; w.el.style.visibility = ''; fly(w.el, from || $(`.di[data-id="${w.id}"]`), true) }
function zoomWin(w) {
  const s = w.el.style; w.el.classList.add('anim')
  if (w.zoom) { Object.assign(s, w.zoom); w.zoom = null } else { w.zoom = { left: s.left, top: s.top, width: s.width, height: s.height }; Object.assign(s, { left: '8px', top: '36px', width: innerWidth - 16 + 'px', height: innerHeight - 124 + 'px' }) }
  setTimeout(() => w.el.classList.remove('anim'), 380)
}
function wire(w) {
  const el = w.el
  el.addEventListener('pointerdown', () => focus(w))
  el.querySelector('.tl').addEventListener('click', (e) => { const a = e.target.dataset.a; if (a === 'close') closeWin(w); if (a === 'min') minWin(w); if (a === 'zoom') zoomWin(w) })
  const bar = el.querySelector('.win__bar')
  bar.addEventListener('dblclick', (e) => { if (!e.target.closest('button, .wsearch')) zoomWin(w) })
  bar.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button, .wsearch')) return
    const x0 = e.clientX - el.offsetLeft, y0 = e.clientY - el.offsetTop
    const mv = (ev) => { el.style.left = ev.clientX - x0 + 'px'; el.style.top = Math.max(28, ev.clientY - y0) + 'px' }
    addEventListener('pointermove', mv); addEventListener('pointerup', () => removeEventListener('pointermove', mv), { once: true })
  })
  el.querySelector('.wsearch').addEventListener('click', openSpot)
  el.querySelector('.qbtn').addEventListener('click', (e) => toggleQA(e.currentTarget, true))
  if (w.id === 'home') wireHome(el)
  el.addEventListener('click', (e) => {
    const m = e.target.closest('[data-open]'); if (m) { openWin(m.dataset.open, m.querySelector('.ic') || m); return }
    const a = e.target.closest('.acts button'); if (a) toast(`${a.textContent.trim()} — opens in ANTZ`)
  })
}

function wireHome(el) {

    $$('[data-ai]', el).forEach((d, i) => d.classList.toggle('on', i === ai)) }

  toast(`Showing ${s}`)
}

/* a module's window: its picture, what it is, its numbers, its actions */
function modBody(id) {
  const m = M[id], figs = FIGS[id], acts = MACTS[id] || []
  return `<div class="main" style="padding:20px"><div class="mhero" style="background:${m.photo ? `linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,.05)),url(${P + m.photo}) center/cover` : m.bg}">${icon(id)}<div><h2>${esc(m.name)}</h2><p>${esc(m.blurb)}</p></div></div>` +
    (figs ? `<div class="figs">${figs.map(([l, v, late]) => `<div class="fig"><small>${esc(l)}</small><b class="${late ? 'late' : ''}">${v}</b></div>`).join('')}</div>` : '<div style="height:16px"></div>') +
    `<div class="acts">${acts.map((a, i) => `<button class="${i ? '' : 'pri'}">${i ? '' : '+ '}${esc(a)}</button>`).join('')}<button>Open ${esc(m.name)} in ANTZ ›</button></div>` +
    `<div class="panel panel--obs"><h3>Latest observation notes</h3><div class="nrail">${NOTES.slice(0, 4).map((n) => `<article class="nc2"><div class="nc2__m" style="background-image:url(${P + n.img})"><span>${n.p}</span></div><div class="nc2__b"><b>${esc(n.title)}</b><small>${esc(n.site)} · ${n.d}</small><p>${esc(n.note)}</p></div></article>`).join('')}</div></div></div>`
}

/* ── widgets ── */
let tT = 'mortality', tR = '7d'
const today = () => { const n = $('#todayN'); n.style.opacity = 0; setTimeout(() => { n.textContent = KI[tT][tR]; n.className = 'today__n' + (tT === 'natality' ? ' nat' : ''); n.style.opacity = 1 }, 120)
  $('#todayL').textContent = tT === 'natality' ? 'births recorded' : 'deaths recorded' }
$('#wgToday').addEventListener('click', (e) => {
  const f = e.target.closest('.flip button'), r = e.target.closest('.seg button')
  if (f) { tT = f.dataset.t; $$('.flip button').forEach((b) => b.setAttribute('aria-pressed', String(b === f))); today() }
  if (r) { tR = r.dataset.r; $$('#wgToday .seg button').forEach((b) => b.setAttribute('aria-pressed', String(b === r))); today() }
})
$('#audSites').innerHTML = SITES.slice(1).map(([n, , , a]) => `<span><span>${n}</span><b style="color:${a < 60 ? '#E2553A' : '#1D2B33'}">${a}%</b></span>`).join('')
setTimeout(() => $('#ringArc').setAttribute('stroke-dasharray', `${(.68 * 169.6).toFixed(1)} 170`), 50)
$('#pendTot').textContent = PEND.reduce((t, p) => t + p[1], 0).toLocaleString('en-US') + ' open'
$('#pend').innerHTML = PEND.map(([l, n, c, mod]) => `<button data-open="${mod}"><i style="background:${c}"></i><span>${l}</span><b>${n.toLocaleString('en-US')}</b></button>`).join('')
$('#pend').addEventListener('click', (e) => { const b = e.target.closest('[data-open]'); if (b) openWin(b.dataset.open, b) })
$('#wgGreet').addEventListener('click', (e) => openWin('home', e.currentTarget))

/* favourites: Quick Look on a click; Edit takes them off; + puts them back */
let favs = store.get('antz.mac.favs', FAVS.map((f) => f.id)).filter((id) => FAVS.some((f) => f.id === id))
const drawFavs = () => {
  $('#favs').innerHTML = favs.map((id) => { const f = FAVS.find((x) => x.id === id); return `<button class="fa" data-f="${id}"><span class="fa__x" data-x="${id}" aria-label="Remove">×</span><img src="${P + f.img}" alt=""><span>${esc(f.sp.split(' ')[0])}</span></button>` }).join('') +
    (favs.length < FAVS.length ? `<button class="fa fa--add" id="favAdd"><div>+</div><span>Add</span></button>` : '')
}
drawFavs()
$('#favEdit').addEventListener('click', () => { const on = $('#wgFav').classList.toggle('editing'); $('#favEdit').textContent = on ? 'Done' : 'Edit' })
$('#favs').addEventListener('click', (e) => {
  const x = e.target.closest('[data-x]'); if (x) { e.stopPropagation(); favs = favs.filter((f) => f !== x.dataset.x); store.set('antz.mac.favs', favs); drawFavs(); return }
  if (e.target.closest('#favAdd')) { const miss = FAVS.filter((f) => !favs.includes(f.id)); if (miss.length) { favs.push(miss[0].id); store.set('antz.mac.favs', favs); drawFavs(); toast(`${miss[0].sp} is a favourite again`) } return }
  const b = e.target.closest('[data-f]'); if (b && !$('#wgFav').classList.contains('editing')) quickLook(FAVS.find((f) => f.id === b.dataset.f), b)
})
let ql = null
function quickLook(f, at) {
  ql && ql.remove(); const r = at.getBoundingClientRect(), s = SEX[f.sex]
  ql = document.createElement('div'); ql.className = 'ql'; ql.style.left = r.right + 18 + 'px'; ql.style.top = Math.max(36, Math.min(innerHeight - 380, r.top - 100)) + 'px'
  ql.innerHTML = `<div class="ql__img" style="background-image:url(${P + f.img})"></div><div class="ql__b"><b>AAID:${f.id}</b><span class="sx" style="background:${s[0]};color:${s[1]}">${s[2]}</span><p>${esc(f.sp)}</p><div class="acts"><button class="pri" data-ql="species">Open in Species</button><button data-ql="note">Add a note</button></div></div>`
  document.body.append(ql)
  ql.addEventListener('click', (e) => { const o = e.target.closest('[data-ql]'); if (!o) return; ql.remove(); ql = null; if (o.dataset.ql === 'species') openWin('species', at); else toast('Observation note — opens in ANTZ') })
}

/* ── Quick Actions, above its Dock icon or under its window button ── */
let qa = null
function toggleQA(b, fromWin) {
  if (qa) return closeQA()
  closeLib(); const r = b.getBoundingClientRect()
  qa = document.createElement('div'); qa.className = 'qa'
  qa.innerHTML = '<h6>Quick Actions</h6>' + QA.map(([l, ic, mod]) => `<button data-mod="${mod}"><i><img src="${I + ic}" alt=""></i>${l}</button>`).join('')
  document.body.append(qa)
  if (fromWin) { qa.style.left = r.right - 280 + 'px'; qa.style.top = r.bottom + 8 + 'px'; qa.style.transformOrigin = '100% 0' }
  else { qa.style.left = r.left + r.width / 2 - 140 + 'px'; qa.style.bottom = innerHeight - r.top + 14 + 'px' }
  qa.addEventListener('click', (e) => { const x = e.target.closest('[data-mod]'); if (x) { closeQA(); openWin(x.dataset.mod); toast(`${x.textContent.trim()} — opens in ANTZ`) } })
}
function closeQA() { qa && qa.remove(); qa = null }

/* ── Spotlight (⌘K): modules, animals, sites, notes, announcements ── */
let sel = 0, hits = []
function openSpot() { closeLib(); closeQA(); $('#spot').classList.add('open'); $('#spotQ').value = ''; spot(); $('#spotQ').focus() }
function closeSpot() { $('#spot').classList.remove('open') }
function spot() {
  const q = $('#spotQ').value.trim().toLowerCase(), has = (s) => !q || s.toLowerCase().includes(q)
  const groups = [
    ['Modules', MODS.filter((m) => has(m.name)).slice(0, q ? 6 : 4).map((m) => ({ h: icon(m.id), t: m.name, s: 'Module', go: () => openWin(m.id) }))],
    ['Animals', FAVS.filter((f) => has(f.sp + ' ' + f.id)).map((f) => ({ h: `<span class="av" style="background-image:url(${P + f.img})"></span>`, t: `AAID:${f.id} · ${f.sp}`, s: 'Animal', go: () => openWin('species') }))],
    ['Sites', SITES.filter(([n]) => has(n)).map(([n, , c]) => ({ h: `<span class="ic" style="background:${c}"></span>`, t: n, s: 'Site', go: () => { openWin('home'); setScope(n) } }))],
    ['Observation notes', q ? NOTES.filter((n) => has(n.title + ' ' + n.tags)).map((n) => ({ h: `<span class="av" style="border-radius:7px;background-image:url(${P + n.img})"></span>`, t: n.title, s: n.site, go: () => openWin('home') })) : []],
    ['Announcements', q ? ANN.filter((a) => has(a.hl)).map((a) => ({ h: `<span class="ic" style="background:#2FA85C"></span>`, t: a.hl, s: a.by, go: () => openWin('home').el._ann(ANN.indexOf(a)) })) : []],
  ].filter((g) => g[1].length)
  hits = groups.flatMap((g) => g[1]); sel = 0
  let i = 0
  $('#spotR').innerHTML = groups.map(([g, l]) => `<h6>${g}</h6>` + l.map((h) => `<button data-i="${i}" class="${i++ === 0 ? 'sel' : ''}">${h.h}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(h.t)}</span><small>${esc(h.s)}</small></button>`).join('')).join('') || (q ? '<h6>No results</h6>' : '')
}
$('#spotQ').addEventListener('input', spot)
$('#spotQ').addEventListener('keydown', (e) => {
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && hits.length) { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length; $$('#spotR button').forEach((b) => b.classList.toggle('sel', +b.dataset.i === sel)); $(`#spotR [data-i="${sel}"]`)?.scrollIntoView({ block: 'nearest' }) }
  if (e.key === 'Enter' && hits[sel]) { closeSpot(); hits[sel].go() }
})
$('#spotR').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) { closeSpot(); hits[+b.dataset.i].go() } })
$('#mbSpot').addEventListener('click', openSpot)

/* ── menus ── */
const menuEl = $('#menu')
function openMenu(items, at) {
  const r = at.getBoundingClientRect(), real = items.filter((x) => x !== '-')
  menuEl.innerHTML = items.map((it) => it === '-' ? '<hr>' : `<button class="${it[2] === 'dim' ? 'dim' : ''}"><span class="chk">${it[3] ? '✓' : ''}</span>${esc(it[0])}${it[2] && it[2] !== 'dim' ? `<kbd>${it[2]}</kbd>` : ''}</button>`).join('')
  menuEl.style.left = Math.min(r.left, innerWidth - 260) + 'px'; menuEl.style.top = r.bottom + 2 + 'px'; menuEl.classList.add('open')
  $$('button', menuEl).forEach((b, i) => { b.onclick = () => { closeMenu(); real[i][1] && real[i][1]() } })
  $$('.mb__it').forEach((b) => b.classList.toggle('open', b === at))
}
function closeMenu() { menuEl.classList.remove('open'); $$('.mb__it').forEach((b) => b.classList.remove('open')) }
const activeWin = () => [...wins.values()].find((w) => w.el.classList.contains('act'))
const MENUS = {
  antz: () => [['About ANTZ', () => toast('ANTZ Command Centre for Mac · a mockup')], '-', ['Settings…', null, '⌘,'], '-', ['Hide Widgets', toggleWgs]],
  file: () => [['New Home Window', () => openWin('home'), '⌘N'], ['Quick Actions…', () => toggleQA($('.di[data-id=qa]'))], '-', ['Close Window', () => { const a = activeWin(); a && closeWin(a) }, '⌘W']],
  edit: () => [['Undo', null, 'dim'], ['Redo', null, 'dim'], '-', ['Edit Favourite Animals', () => $('#favEdit').click()], ['Find…', openSpot, '⌘K']],
  view: () => [['Show Widgets', toggleWgs, null, !$('#wgs').classList.contains('hide')], ['Show Notifications', toggleNc, null, !$('#nc').classList.contains('away')], ['Dock Magnification', () => { magOn = !magOn; store.set('antz.mac.mag', magOn) }, null, magOn], '-', ['All Modules', () => openLib(), '⌘L']],
  sites: () => SITES.map(([n]) => [n, () => { openWin('home'); setScope(n) }, null, n === scope]),
  window: () => [['Minimise All', () => wins.forEach((w) => !w.min && minWin(w))], ['Bring All to Front', () => wins.forEach((w) => { if (w.min) restore(w); focus(w) })], '-', ...[...wins.values()].map((w) => [nameOf(w.id), () => { if (w.min) restore(w); focus(w) }, null, w.el.classList.contains('act')]), ...(wins.size ? [] : [['No windows open', null, 'dim']])],
  help: () => [['Show the welcome again', () => { store.set('antz.mac.seen', null); store.set('antz.mac.tip', false); location.reload() }], ['⌘K search · ⌘L modules · Esc closes', null, 'dim']],
}
$('#mb').addEventListener('click', (e) => { const b = e.target.closest('[data-menu]'); if (!b) return; e.stopPropagation(); menuEl.classList.contains('open') && b.classList.contains('open') ? closeMenu() : openMenu(MENUS[b.dataset.menu](), b) })
$('#mb').addEventListener('mouseover', (e) => { const b = e.target.closest('[data-menu]'); if (b && menuEl.classList.contains('open') && !b.classList.contains('open')) openMenu(MENUS[b.dataset.menu](), b) })
function toggleWgs() { $('#wgs').classList.toggle('hide') }
function toggleNc() { $('#nc').classList.toggle('away') }
$('#mbNc').addEventListener('click', toggleNc)

/* ── WELCOME BACK · for the people who already use ANTZ ── */
const seen = store.get('antz.mac.seen', null), last = seen ? new Date(seen) : new Date(Date.now() - 4 * 864e5)
const ago = (d) => { const n = Math.round((Date.now() - d) / 864e5); return n < 1 ? 'earlier today' : n === 1 ? 'yesterday' : 'on ' + d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' }) }
$('#nc').innerHTML =
  `<div class="nt glass"><button class="nt__x" aria-label="Dismiss">×</button><div class="nt__h"><img src="${P}antz-logo.png" alt="">ANTZ<time>now</time></div>` +
    `<b>Welcome back, Sourav</b><div>You were last here ${ago(last)}. While you were away:</div>` +
    `<div class="chips"><span><b>7</b> announcements</span><span><b>6</b> notes</span><span><b>76</b> births</span><span><b>192</b> deaths</span><span><b>462</b> overdue doses</span></div>` +
    `<div class="nt__btns"><button class="pri" data-go="home">Catch me up</button><button data-go="x">Later</button></div></div>` +
  `<div class="nt glass stack" id="annStack"><button class="nt__x" aria-label="Dismiss">×</button><div class="nt__h"><img src="${I}an-announce.svg" alt="" style="background:#2FA85C;padding:2px">Announcements<time>${ANN.length} new</time></div>` +
    `<b>${esc(ANN[0].hl)}</b><div style="color:#54636A">${esc(ANN[0].by)} · and ${ANN.length - 1} more — click to expand</div>` +
    `<div class="stack__list">${ANN.map((a, i) => `<button data-ann="${i}"><i style="${a.img ? `background-image:url(${P + a.img})` : 'background:linear-gradient(135deg,#AFEFEB,#CBEAE8)'}"></i><span>${esc(a.hl)}<small>${esc(a.by)} · ${esc(a.d)}</small></span></button>`).join('')}</div></div>` +
  `<div class="nt glass"><button class="nt__x" aria-label="Dismiss">×</button><div class="nt__h"><img src="${P}antz-logo.png" alt="">New on Mac<time>tip</time></div>` +
    `<b>Your modules live in the Dock now</b><div>Open <b>Modules</b> to see them all; drag one into the Dock to keep it, drag it out to let it go. Press <b>⌘K</b> to find anything.</div></div>`
$('#nc').addEventListener('click', (e) => {
  const gone = (n) => { n.classList.add('gone'); setTimeout(() => n.remove(), 350) }
  const x = e.target.closest('.nt__x, [data-go="x"]'); if (x) { gone(x.closest('.nt')); return }
  if (e.target.closest('[data-go="home"]')) { const n = e.target.closest('.nt'); openWin('home', n); gone(n); return }
  const a = e.target.closest('[data-ann]'); if (a) { openWin('home', a).el._ann(+a.dataset.ann); return }
  const s = e.target.closest('#annStack'); if (s) s.classList.toggle('open')
})
store.set('antz.mac.seen', new Date().toISOString())

renderDock()
/* the first-visit tip over the Modules icon */
if (!store.get('antz.mac.tip', false)) {
  const b = $('.di[data-id=lib]'), r = b.getBoundingClientRect()
  b.querySelector('.ic').classList.add('pulse')
  const t = document.createElement('div'); t.className = 'tip'; t.style.left = Math.max(12, r.left + r.width / 2 - 40) + 'px'; t.style.bottom = innerHeight - r.top + 16 + 'px'; t.style.setProperty('--ax', '40px')
  t.innerHTML = '<b>All your modules are in here</b>Open it, then drag any module into the Dock.<br><button>Got it</button>'
  document.body.append(t)
  const done = () => { t.remove(); store.set('antz.mac.tip', true) }
  t.querySelector('button').onclick = done
  dock.addEventListener('pointerdown', done, { once: true })
}

addEventListener('dragstart', (e) => e.preventDefault())
/* ── keys and outside clicks ── */
addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#spot').classList.contains('open') ? closeSpot() : openSpot() }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'l') { e.preventDefault(); toggleLib() }
  if (e.key === 'Escape') { closeSpot(); closeLib(); closeQA(); closeMenu(); ql && (ql.remove(), ql = null) }
})
addEventListener('pointerdown', (e) => {
  if (!e.target.closest('.menu, .mb, .lib__more')) closeMenu()
  if (!e.target.closest('.lib, .di[data-id=lib], .menu')) closeLib()
  if (!e.target.closest('.qa, .di[data-id=qa], .qbtn')) closeQA()
  if (!e.target.closest('.spot, #mbSpot, .di[data-id=spot], .wsearch')) closeSpot()
  if (!e.target.closest('.ql, .fa')) { ql && ql.remove(); ql = null }
}, true)
</script>
</body>
</html>
