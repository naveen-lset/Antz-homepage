<style>
/* V2 Home with the Swiggy-anatomy header (owner, 30 Sep 2026). The page
   below is the REAL V2 (../index.html?v=2) in a frame; its greeting, search,
   sky, Favourites rail and site tabs are hidden and this one band replaces
   them. It is the owner's reference exactly: SITE folder tabs → search →
   chip row → WORD [photo] WORD with dots → tiles. What changed is the
   wordmark's content: the four dots are four slides, and each slide brings
   its own chip row and tiles:
     1 MY FAVOURITES · Species / Enclosures / Animals        (asked for)
     2 NEW BORN      · 0–7 days / 8–30 days / 1–3 / 3–12 months (asked for)
     3 VET WATCH     · Critical / Treating / Recovering / Quarantine (suggested)
     4 ON THE MOVE   · Incoming / Outgoing / Settling in     (suggested)
   Two earlier readings were sent back: slides with a pill switcher under the
   wordmark, then the four as the folder tabs with the site in a pill.
   Favourite species are V2's own; everything else is sample. */
:root { --page: #E9EFEC; --ink: #1F415B; --ink-2: #4A5A63; --panel: #fff; --line: rgba(31, 65, 91, .12); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #0F1715; --ink: #E4ECEE; --ink-2: #A9B7BC; --panel: #17211E; --line: rgba(228, 236, 238, .14); } }
:root[data-theme="dark"] { --page: #0F1715; --ink: #E4ECEE; --ink-2: #A9B7BC; --panel: #17211E; --line: rgba(228, 236, 238, .14); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; }
.bar { width: 100%; max-width: 1100px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; padding: 14px 16px; }
.bar h1 { margin: 0; font-size: 16px; font-weight: 700; }
.bar p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-2); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--line); }
.seg button { min-height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: none; color: inherit; font: 600 13px Inter, system-ui, sans-serif; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.dev { flex: 1; min-height: 0; width: min(100% - 32px, var(--fw, 744px)); margin-bottom: 16px; border-radius: 28px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px rgba(31, 65, 91, .1), 0 30px 70px -30px rgba(16, 45, 52, .5); }
.dev iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>

/* ─────────────── the header, injected into the V2 document ─────────────── */
const CSS = `

.th__deep { position: relative; z-index: 3; background: var(--deep); transition: background-color .5s ease; }
.th__top { display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px; }

.th__hi { font-size: 19px; font-weight: 800; letter-spacing: -.01em; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.th__roll { position: relative; display: inline-block; height: 20px; overflow: hidden; vertical-align: top; }

.th__v { position: absolute; left: 10px; bottom: 6px; font-family: Anton, Impact, sans-serif; font-size: 32px; line-height: 38px; }
.th__v--long { font-size: 26px; }  /* 4+ characters would run under the photo */
.th__img { position: absolute; right: 8px; bottom: 10px; width: 42px; height: 42px; border-radius: 10px; overflow: hidden; border: 2px solid rgba(255, 255, 255, .9); transform: rotate(6deg); }
.th__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.th__tile--hot { border-color: rgba(255, 150, 150, .85); background: rgba(229, 72, 77, .3); }
.th__tile--all { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: rgba(255, 255, 255, .1); text-align: center; }
.th__tile--all b { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: #fff; color: var(--deep); font-size: 18px; }
.th__tile--all span { font-size: 12.5px; font-weight: 700; }
.th__tile:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.th__tile.in { animation: th-rise .42s cubic-bezier(.2, .9, .3, 1.2) both; animation-delay: calc(var(--i) * 40ms); }
@keyframes th-rise { from { opacity: 0; transform: translateY(12px); } }
.th__toast { position: fixed; left: 50%; bottom: 24px; z-index: 50; transform: translateX(-50%); padding: 10px 16px; border-radius: 12px; background: #1F2A28; color: #fff; font: 600 13px Inter, system-ui, sans-serif; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .5); pointer-events: none; }

@container (min-width: 600px) {
  .th__top { padding: 26px 24px 14px; }
  .th__hi { font-size: 22px; line-height: 28px; }
  .th__tabs { padding: 2px 14px 0; }
  .th__tab { min-height: 88px; }
  .th__pic { width: 46px; height: 46px; }
  .th__lab { font-size: 14px; }
  .th__body { padding: 16px 24px 22px; }
  .th__search { height: 54px; font-size: 16px; }
  .th__scan { width: 54px; height: 54px; }
  .th__chips { gap: 26px; margin-inline: -24px; padding-inline: 24px; }
  .th__chip { font-size: 13px; }
  .th__tiles { margin-inline: -24px; padding-inline: 24px; scroll-padding-inline: 24px; }
  .th__tile { width: calc((100cqw - 48px - 24px) / 4.3); height: 132px; padding: 12px; }
  .th__k { font-size: 14px; line-height: 17px; }
  .th__s { font-size: 12px; line-height: 15px; }
  .th__v { left: 12px; font-size: 38px; line-height: 44px; }
  .th__v--long { font-size: 30px; }
  .th__img { width: 54px; height: 54px; }
}
@media (prefers-reduced-motion: reduce) { .th__pat { animation: none; } .th__tile.in { animation: none; } }

  ['Chital calf', 'chital', 'Oak Dale · ♀'], ['Blackbuck fawn', 'blackbuck', 'Flint Meadow · ♂'], ['Peachicks ×3', 'indian-peafowl', 'Ivy Rise Coop'],
  ['Bonnet macaque', 'bonnet-macaque', 'Glen Knoll · ♀'], ['Nilgai calf', 'nilgai', 'Clover Grove · ♂'], ['Sambar fawn', 'sambar', 'Cedar Grove · ♀'],
  ['Sarus chick', 'sarus-crane', 'Larch Marsh'], ['Barasingha calf', 'barasingha', 'Moss Combe · ♂'], ['Star tortoise ×4', 'indian-star-tortoise', 'Lake Ridge'],
  ['Rhesus infant', 'rhesus-macaque', 'Briar Moor · ♀'], ['Parakeet chick', 'rose-ringed-parakeet', 'Ivy Rise Coop'], ['Gaur calf', 'gaur', 'Pine Leigh · ♂'],
]
const VET = [
  ['Mira', 'indian-leopard', 'Dental abscess'], ['Gaur #12', 'gaur', 'Lame, left fore'], ['Black kite', 'black-kite', 'Wing fracture'], ['Bholu', 'sloth-bear', 'Post-op'],
  ['Hill myna', 'hill-myna', 'Weight loss'], ['Python #4', 'indian-rock-python', 'Retained shed'], ['Sambar hind', 'sambar', 'Eye infection'], ['Tara', 'sumatran-orangutan', 'Respiratory'],
]
const MOVES = [
  ['Sarus pair', 'sarus-crane', 'From Hollowpine'], ['Blackbuck ×6', 'blackbuck', 'From Foxglen'], ['Veer', 'asiatic-lion', 'To Crimson Frosted'],
  ['Star tortoises', 'indian-star-tortoise', 'Rescue, in today'], ['Chital ×10', 'chital', 'To Hollowpine'], ['Cinereous vulture', 'cinereous-vulture', 'In quarantine'],
  ['Hill myna ×4', 'hill-myna', 'In quarantine'], ['Nilgai bull', 'nilgai', 'To Foxglen'],
]
const take = (arr, from, n) => Array.from({ length: n }, (_, i) => arr[(from + i) % arr.length])

/* the four slides. Each has chips; each chip has tiles; `unit` names the count in the wordmark tag.
   Tile: { k: label, s: line, v: number, u: unit, img, hot, go } */
function tabs(site, fav) {
  const s = site
  return [
    { label: 'Favourites', pic: fav[0]?.img || IMG('bengal-tiger'), words: ['My', 'Favourites'],
      chips: [
        { label: 'Species', unit: 'species', icon: 'paw', tiles: fav.map((f) => ({ k: f.name, s: '', v: f.n, u: 'animals', img: f.img, go: { fav: f.name } })), all: 'Edit favourites' },
        { label: 'Enclosures', unit: 'enclosures', icon: 'fence', tiles: take(ENCLOSURES, s, 4).map(([k, im, line, v]) => ({ k, s: line, v, u: 'animals', img: IMG(im), go: { toast: `${k} · enclosure page` } })), all: 'Edit favourites' },
        { label: 'Animals', unit: 'animals', icon: 'tag', tiles: take(ANIMALS, s * 2, 5).map(([k, im, line, v, u]) => ({ k, s: line, v, u, img: IMG(im), go: { toast: `${k} · animal profile` } })), all: 'Edit favourites' },
      ] },
    { label: 'New Born', pic: IMG('chital'), words: ['New', 'Born'],
      chips: [
        { label: '0–7 days', unit: 'born', icon: 'sprout', tiles: take(NEWBORN, s, 3).map(([k, im, line], i) => ({ k, s: line, v: [2, 4, 6][i], u: 'days old', img: IMG(im), go: { hash: '#m/natality?days=10' } })), all: 'All births' },
        { label: '8–30 days', unit: 'born', icon: 'clock', tiles: take(NEWBORN, s + 3, 4).map(([k, im, line], i) => ({ k, s: line, v: [11, 16, 22, 29][i], u: 'days old', img: IMG(im), go: { hash: '#m/natality?days=30' } })), all: 'All births' },
        { label: '1–3 months', unit: 'born', icon: 'cal', tiles: take(NEWBORN, s + 7, 3).map(([k, im, line], i) => ({ k, s: line, v: [5, 8, 11][i], u: 'weeks old', img: IMG(im), go: { hash: '#m/natality?days=30' } })), all: 'All births' },
        { label: '3–12 months', unit: 'born', icon: 'cal', tiles: take(NEWBORN, s + 10, 2).map(([k, im, line], i) => ({ k, s: line, v: [4, 9][i], u: 'months old', img: IMG(im), go: { hash: '#m/natality?days=30' } })), all: 'All births' },
      ] },
    { label: 'Vet Watch', pic: IMG('indian-leopard'), words: ['Vet', 'Watch'],
      chips: [
        { label: 'Critical', unit: 'critical', icon: 'alert', hot: true, tiles: take(VET, s, 1 + (s % 2)).map(([k, im, line], i) => ({ k, s: line, v: [2, 1][i], u: 'days in', img: IMG(im), hot: true, go: { hash: '#m/medical' } })), all: 'Medical' },
        { label: 'Treating', unit: 'on treatment', icon: 'cross', tiles: take(VET, s + 2, 4).map(([k, im, line], i) => ({ k, s: line, v: `${[3, 5, 1, 8][i]}/${[7, 10, 5, 14][i]}`, u: 'day of course', img: IMG(im), go: { hash: '#m/medical' } })), all: 'Medical' },
        { label: 'Recovering', unit: 'recovering', icon: 'heart', tiles: take(VET, s + 5, 2).map(([k, im], i) => ({ k, s: `Recheck ${['Thu', 'Sat'][i]}`, v: [12, 6][i], u: 'days since', img: IMG(im), go: { hash: '#m/medical' } })), all: 'Medical' },
        { label: 'Quarantine', unit: 'in quarantine', icon: 'shield', tiles: take(VET, s + 6, 2).map(([k, im], i) => ({ k, s: `Release ${['Mon', 'Fri'][i]}`, v: `${[12, 4][i]}/21`, u: 'quarantine day', img: IMG(im), go: { hash: '#m/medical' } })), all: 'Medical' },
      ] },
    { label: 'On the Move', pic: IMG('sarus-crane'), words: ['On the', 'Move'],
      chips: [
        { label: 'Incoming', unit: 'coming in', icon: 'in', tiles: take(MOVES, s, 2).map(([k, im, line], i) => ({ k, s: line, v: ['Thu', 'Fri'][i], u: 'arrives', img: IMG(im), go: { toast: `${k} · transfer` } })), all: 'All transfers' },
        { label: 'Outgoing', unit: 'going out', icon: 'out', tiles: take(MOVES, s + 2, 2).map(([k, im, line], i) => ({ k, s: line, v: ['Mon', 'Wed'][i], u: 'leaves', img: IMG(im), go: { toast: `${k} · transfer` } })), all: 'All transfers' },
        { label: 'Settling in', unit: 'settling in', icon: 'home', tiles: take(MOVES, s + 5, 3).map(([k, im, line], i) => ({ k, s: line, v: `${[9, 3, 1][i]}/${[21, 30, 14][i]}`, u: 'settling day', img: IMG(im), go: { toast: `${k} · settling-in log` } })), all: 'All transfers' },
      ] },
  ]
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

function mountHeader(doc) {
  const win = doc.defaultView
  const REDUCED = win.matchMedia('(prefers-reduced-motion: reduce)').matches
  const style = doc.createElement('style'); style.textContent = CSS; doc.head.appendChild(style)
  const font = doc.createElement('link'); font.rel = 'stylesheet'; font.href = 'https://fonts.googleapis.com/css2?family=Anton&display=swap'; doc.head.appendChild(font)

  // favourites straight from V2's own rail, so the header and the app agree
  const fav = [...doc.querySelectorAll('#favSpecies .fav__card[data-name]')].map((b) => ({
    name: b.dataset.name, n: parseInt(b.querySelector('.fav__meta')?.textContent, 10) || 0, img: b.querySelector('img')?.getAttribute('src') || IMG('bengal-tiger'),
  }))
  if (!fav.length) fav.push({ name: 'Bengal Tiger', n: 4, img: IMG('bengal-tiger') })

  const now = new Date(), h = now.getHours()
  const hi = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'
  const day = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' })
  const who = (doc.querySelector('.greeting__name')?.textContent || 'Sourav').trim().split(/\s+/)[0]

  let site = 0, T = tabs(0, fav), tab = 0, chip = T.map(() => 0), hintI = 0, gen = 0, busy = false, auto = !REDUCED

  const el = doc.createElement('header')
  el.className = 'th'
  el.innerHTML = `
    <div class="th__deep">
      <div class="th__top">
        <div class="th__who"><div class="th__hi">${esc(hi)}, ${esc(who)}</div>
          <div class="th__sub">${esc(day)} · ${SITES.length} sites</div></div>
        <button class="th__btn" type="button" aria-label="Notifications"><img src="assets/icon/v2-bell.svg" alt=""></button>
        <span class="th__ava"><img src="assets/img/avatar.png" alt=""></span>
      </div>
      <div class="th__tabs" role="tablist" aria-label="Site"></div>
    </div>
    <div class="th__body" role="tabpanel">
      <div class="th__pat"></div>
      <div class="th__srow">
        <div class="th__search"><img src="assets/icon/v2-search.svg" alt=""><span class="th__stxt">Search for “<span class="th__roll"><span></span><span></span></span>”</span><span class="th__rule"></span>${ICON.mic}</div>
        <button class="th__scan" type="button" aria-label="Scan tag"><img src="assets/icon/v2-scan.svg" alt=""></button>
      </div>
      <div class="th__chips" role="tablist"></div>
      <button class="th__wm" type="button"><span class="th__w th__l"></span><span class="th__ph"><span class="th__card"><img alt=""></span><em class="th__tag"></em></span><span class="th__w th__r"></span></button>
      <div class="th__dots" role="tablist" aria-label="Slides"></div>
      <div class="th__tiles"></div>
    </div>`
  doc.querySelector('main.page').insertBefore(el, doc.querySelector('.main-frame'))

  const $ = (s) => el.querySelector(s)
  const wm = $('.th__wm'), L = $('.th__l'), R = $('.th__r'), card = $('.th__card'), img = $('.th__card img'), tag = $('.th__tag')
  const tabsEl = $('.th__tabs'), chipsEl = $('.th__chips'), dots = $('.th__dots'), tiles = $('.th__tiles'), roll = $('.th__roll'), [r0, r1] = roll.children
  const cur = () => T[tab], curChip = () => T[tab].chips[chip[tab]], curTiles = () => curChip().tiles
  const textW = (t) => { const m = doc.createElement('span'); m.style.cssText = 'position:absolute;visibility:hidden;font-weight:500;white-space:nowrap'; m.textContent = t; roll.parentNode.appendChild(m); const x = Math.ceil(m.getBoundingClientRect().width); m.remove(); return x }

  // measured at rest (no letter spread), then checked against the real box
  function fit() {
    const W = el.clientWidth - (el.clientWidth >= 600 ? 48 : 32)
    const pw = Math.round(Math.min(170, W * 0.28)), max = W >= 560 ? 104 : 64
    el.style.setProperty('--pw', pw + 'px')
    const ls = [L.style.letterSpacing, R.style.letterSpacing]; L.style.letterSpacing = R.style.letterSpacing = '0'
    const gap = parseFloat(win.getComputedStyle(wm).columnGap) || 0
    const room = W * 0.94 - pw - gap * 2
    let size = max
    for (let k = 0; k < 4; k++) {
      el.style.setProperty('--wm', size.toFixed(1) + 'px')
      const words = L.getBoundingClientRect().width + R.getBoundingClientRect().width
      if (words <= room) break
      size = Math.max(26, size * room / words - 0.5)
    }
    L.style.letterSpacing = ls[0]; R.style.letterSpacing = ls[1]
  }

  function paintTabs() {
    tabsEl.innerHTML = SITES.map((t, i) => `<button class="th__tab" role="tab" type="button" aria-selected="${i === site}" data-i="${i}">
      <span class="th__pic"><img src="${IMG(t.img)}" alt=""></span><span class="th__lab">${esc(t.label)}</span></button>`).join('')
  }
  function paintBand() {
    const t = SITES[site]
    el.style.setProperty('--tint', t.tint); el.style.setProperty('--deep', t.deep)
    $('.th__pat').style.backgroundImage = motifURL(t.motif)
    tabsEl.querySelectorAll('.th__tab').forEach((b, i) => b.setAttribute('aria-selected', i === site))
  }
  function paintChips() {
    chipsEl.setAttribute('aria-label', cur().label)
    chipsEl.innerHTML = cur().chips.map((c, i) => `<button class="th__chip" type="button" role="tab" aria-selected="${i === chip[tab]}" data-i="${i}">${ICON[c.icon]}${esc(c.label)}<i${c.hot ? ' class="hot"' : ''}>${c.tiles.length}</i></button>`).join('')
    chipsEl.scrollLeft = 0
  }
  function paintItem() {
    const t = cur(), c = curChip()
    img.src = c.tiles[0]?.img || t.pic
    tag.textContent = `${c.tiles.length} ${c.unit} ›`
    wm.setAttribute('aria-label', `${t.words.join(' ')}: ${c.tiles.length} ${c.unit}. Next slide`)
    dots.innerHTML = T.map((x, i) => `<button class="th__dot" type="button" role="tab" aria-label="${esc(x.words.join(' '))}" aria-current="${i === tab}"><i></i></button>`).join('')
  }
  function paintWords() { L.textContent = cur().words[0]; R.textContent = cur().words[1]; fit() }
  function paintTiles() {
    const c = curChip()
    tiles.innerHTML = c.tiles.map((x, i) => `<button class="th__tile in${x.hot ? ' th__tile--hot' : ''}" type="button" data-i="${i}" style="--i:${i}">
        <span class="th__k">${esc(x.k)}</span><span class="th__s">${esc([x.u, x.s].filter(Boolean).join(' · '))}</span>
        <span class="th__v${String(x.v).length > 3 ? ' th__v--long' : ''}">${esc(x.v)}</span>
        <span class="th__img"><img src="${x.img}" alt=""></span></button>`).join('')
      + `<button class="th__tile th__tile--all in" type="button" data-all style="--i:${c.tiles.length}"><b>›</b><span>${esc(c.all)}</span></button>`
    tiles.scrollLeft = 0
  }
  function paintHint() { const hs = SITES[site].hint; r0.textContent = hs[hintI % hs.length]; roll.style.width = textW(r0.textContent) + 'px' }
  function rollHint() {
    const hs = SITES[site].hint, next = hs[(hintI + 1) % hs.length], w = textW(next), s0 = site
    r1.textContent = next
    const o = { duration: 420, easing: 'cubic-bezier(.3,.8,.3,1)', fill: 'forwards' }
    roll.animate([{ width: roll.offsetWidth + 'px' }, { width: w + 'px' }], o)
    r0.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(-100%)', opacity: 0 }], o)
    r1.animate([{ transform: 'translateY(0)', opacity: 0 }, { transform: 'translateY(-100%)', opacity: 1 }], o).finished.then(() => {
      if (s0 !== site) return
      hintI++; [r0, r1, roll].forEach((x) => x.getAnimations().forEach((a) => a.cancel()))
      r0.textContent = next; roll.style.width = w + 'px'
    }).catch(() => {})
  }

  /* the recording's move: same words → the photo alone drops out and in;
     new words → the letters spread as the photo shrinks, close as it springs in */
  function turn(apply, sameWords) {
    const g = ++gen
    ;[card, tag, L, R].forEach((x) => x.getAnimations().forEach((a) => a.cancel()))
    if (REDUCED) { apply(); return }
    busy = true
    const out = { duration: 280, easing: 'cubic-bezier(.5,0,.8,.4)', fill: 'forwards' }
    card.animate([{ transform: 'rotate(-4deg) scale(1)', opacity: 1 }, { transform: `rotate(${sameWords ? -14 : 10}deg) scale(.35)`, opacity: 0 }], out).finished.then(() => {
      if (g !== gen) return
      apply()
      card.getAnimations().forEach((a) => a.cancel())
      card.animate([{ transform: 'translateY(-24px) rotate(8deg) scale(.4)', opacity: 0 }, { transform: 'rotate(-4deg) scale(1)', opacity: 1 }], { duration: 520, easing: 'cubic-bezier(.2,1.4,.4,1)' })
      tag.animate([{ opacity: 0, transform: 'translate(-50%, 6px)' }, { opacity: 1, transform: 'translate(-50%, 0)' }], { duration: 260, delay: 220, fill: 'backwards', easing: 'ease-out' })
      if (!sameWords) [L, R].forEach((w) => { w.getAnimations().forEach((a) => a.cancel()); w.animate([{ letterSpacing: '.32em', opacity: .15, filter: 'blur(2px)' }, { letterSpacing: '0em', opacity: 1, filter: 'blur(0)' }], { duration: 460, easing: 'cubic-bezier(.2,.9,.3,1)' }) })
      busy = false
    }).catch(() => {})
    tag.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150, fill: 'forwards' })
    if (!sameWords) [L, R].forEach((w) => w.animate([{ letterSpacing: '0em', opacity: 1, filter: 'blur(0)' }, { letterSpacing: '.32em', opacity: .15, filter: 'blur(2px)' }], out))
  }

  function goSlide(i) {
    const n = (i + T.length) % T.length
    if (n === tab) return
    tab = n
    paintChips(); paintTiles()
    turn(() => { paintWords(); paintItem() }, false)
  }
  function goChip(i) {
    if (i === chip[tab]) return
    chip[tab] = i
    chipsEl.querySelectorAll('.th__chip').forEach((b, k) => b.setAttribute('aria-selected', k === i))
    paintTiles()
    turn(paintItem, true)
  }
  function goSite(i) {
    if (i === site) return
    site = i
    T = tabs(i, fav)
    paintBand(); paintChips(); paintTiles()
    ;[r0, r1, roll].forEach((x) => x.getAnimations().forEach((a) => a.cancel())); hintI = 0; paintHint()
    turn(() => { paintWords(); paintItem() }, true)
    // V2's page below follows: its hidden site tab of the same name
    ;[...doc.querySelectorAll('#siteTabsV2 .site-tabs__tab')].find((b) => b.textContent.trim() === SITES[i].label)?.click()
  }
  const stop = () => { auto = false }   // once someone works the slide, it stops turning on its own

  tabsEl.addEventListener('click', (e) => { const b = e.target.closest('.th__tab'); if (b) goSite(+b.dataset.i) })
  tabsEl.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return
    const i = (site + (e.key === 'ArrowRight' ? 1 : -1) + SITES.length) % SITES.length
    goSite(i); tabsEl.children[i].focus()
  })
  chipsEl.addEventListener('click', (e) => { const b = e.target.closest('.th__chip'); if (b) { stop(); goChip(+b.dataset.i) } })
  dots.addEventListener('click', (e) => { const b = e.target.closest('.th__dot'); if (b) { stop(); goSlide([...dots.children].indexOf(b)) } })
  let x0 = null, swiped = false
  wm.addEventListener('pointerdown', (e) => { x0 = e.clientX; swiped = false })
  wm.addEventListener('pointerup', (e) => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 36) { swiped = true; stop(); goSlide(tab + (dx < 0 ? 1 : -1)) } })
  wm.addEventListener('click', () => { if (swiped) return; stop(); goSlide(tab + 1) })

  let toastT
  const toast = (msg) => {
    doc.querySelector('.th__toast')?.remove(); clearTimeout(toastT)
    const t = doc.createElement('div'); t.className = 'th__toast'; t.textContent = msg; doc.body.appendChild(t)
    toastT = setTimeout(() => t.remove(), 1800)
  }
  const open = (x) => {
    if (!x) return
    if (x.go.fav) { const f = [...doc.querySelectorAll('#favSpecies .fav__card')].find((c) => c.dataset.name === x.go.fav); if (f) return f.click() }
    if (x.go.hash) { win.location.hash = x.go.hash; return }
    toast(`${x.go.toast || 'Opens'} (not built yet)`)
  }
  tiles.addEventListener('click', (e) => {
    const b = e.target.closest('.th__tile'); if (!b) return
    stop()
    if (b.hasAttribute('data-all')) return toast(`${curChip().all} · opens the full list`)
    open(curTiles()[+b.dataset.i])
  })

  // slides turn every 6s until someone touches a chip, dot, tile or the wordmark
  let seen = true
  new win.IntersectionObserver(([e]) => { seen = e.isIntersecting }).observe(el)
  el.addEventListener('pointerenter', () => { el.dataset.hover = '1' }); el.addEventListener('pointerleave', () => { delete el.dataset.hover })
  if (!REDUCED) setInterval(() => { if (auto && seen && !busy && !el.dataset.hover) goSlide(tab + 1) }, 6000)
  if (!REDUCED) setInterval(() => { if (seen) rollHint() }, 2400)

  font.addEventListener('load', () => doc.fonts.load('64px Anton').then(fit).catch(() => {}))
  doc.fonts.addEventListener?.('loadingdone', fit)
  new win.ResizeObserver(() => win.requestAnimationFrame(fit)).observe(el)

  paintTabs(); paintBand(); paintChips(); paintTiles(); paintHint(); paintWords(); paintItem()
  ;[...doc.querySelectorAll('#siteTabsV2 .site-tabs__tab')].find((b) => b.textContent.trim() === SITES[0].label)?.click()
  return el
}

/* ── wait for V2 to draw its rail and site tabs, then mount ──
   Opened from disk (file://) Chrome treats the frame as another origin, so
   the header cannot be injected and plain V2 shows. Say so instead. */
const app = document.getElementById('app')
if (location.protocol === 'file:') {
  const url = 'http://127.0.0.1:8000/mockups/home-v2-tabbed-header.html'
  document.querySelector('.bar').insertAdjacentHTML('afterend', `<div style="width:min(100% - 32px,744px);margin:0 0 12px;padding:14px 16px;border-radius:14px;background:#FFF1E6;color:#6B2E0A;font:600 14px/1.5 Inter,system-ui,sans-serif">Opened as a file, so the new header can’t be added and you’re seeing plain V2. Open it through the local server instead: <a href="${url}" style="color:inherit">${url}</a></div>`)
}
app.addEventListener('load', () => {
  let doc
  try { doc = app.contentDocument; if (!doc) return } catch { return }
  const t0 = Date.now()
  ;(function wait() {
    if (doc.querySelector('#favSpecies .fav__card[data-name]') && doc.querySelector('#siteTabsV2 .site-tabs__tab') && doc.querySelector('main.page .main-frame')) return mountHeader(doc)
    if (Date.now() - t0 < 8000) setTimeout(wait, 80)
  })()
})

document.querySelectorAll('[data-fw]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-fw]').forEach((x) => x.setAttribute('aria-pressed', x === b))
  document.getElementById('dev').style.setProperty('--fw', b.dataset.fw + 'px')
}))
</script>
